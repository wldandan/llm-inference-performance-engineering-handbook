<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-1 第一个请求与生命周期总览</title><desc id="fig-desc">展示一次流式请求从客户端发出，经 Gateway、Queue、Prefill、首 token 和 Decode，最终返回完整响应。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.lane{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.5}.node{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.6}.strong{fill:#FFFFFF;stroke:#0F172A;stroke-width:2.2}.n{fill:#0F172A}.nt{font-size:14px;font-weight:750;fill:#FFFFFF}.h{font-size:18px;font-weight:750}.s{font-size:14px;fill:#64748B}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">FIRST SERVICE · 01</text><text class="t" x="56" y="84">第一个请求与生命周期总览</text><text class="sub" x="56" y="114">客户端看到一次流式回答，服务端实际走过一条连续处理链</text>
  <rect class="lane" x="56" y="174" width="1168" height="342" rx="22"/><text class="s" x="82" y="208">REQUEST PATH · 从发出请求到完整结束</text>
  <g transform="translate(72 244)"><rect class="strong" width="140" height="170" rx="16"/><circle class="n" cx="24" cy="24" r="15"/><text class="nt" x="24" y="29" text-anchor="middle" fill="#FFFFFF">1</text><text class="h" x="70" y="78" text-anchor="middle">Request</text><text class="s" x="70" y="106" text-anchor="middle">客户端发出</text><text class="s" x="70" y="134" text-anchor="middle">prompt + params</text></g>
  <g transform="translate(236 244)"><rect class="node" width="140" height="170" rx="16"/><circle class="n" cx="24" cy="24" r="15"/><text class="nt" x="24" y="29" text-anchor="middle" fill="#FFFFFF">2</text><text class="h" x="70" y="78" text-anchor="middle">Gateway</text><text class="s" x="70" y="106" text-anchor="middle">协议入口</text><text class="s" x="70" y="134" text-anchor="middle">校验请求</text></g>
  <g transform="translate(400 244)"><rect class="node" width="140" height="170" rx="16"/><circle class="n" cx="24" cy="24" r="15"/><text class="nt" x="24" y="29" text-anchor="middle" fill="#FFFFFF">3</text><text class="h" x="70" y="78" text-anchor="middle">Queue</text><text class="s" x="70" y="106" text-anchor="middle">等待执行</text><text class="s" x="70" y="134" text-anchor="middle">尚未计算</text></g>
  <g transform="translate(564 244)"><rect class="node" width="140" height="170" rx="16"/><circle class="n" cx="24" cy="24" r="15"/><text class="nt" x="24" y="29" text-anchor="middle" fill="#FFFFFF">4</text><text class="h" x="70" y="78" text-anchor="middle">Prefill</text><text class="s" x="70" y="106" text-anchor="middle">处理完整输入</text><text class="s" x="70" y="134" text-anchor="middle">写入 KV</text></g>
  <g transform="translate(728 244)"><rect class="strong" width="140" height="170" rx="16"/><circle class="n" cx="24" cy="24" r="15"/><text class="nt" x="24" y="29" text-anchor="middle" fill="#FFFFFF">5</text><text class="h" x="70" y="74" text-anchor="middle">First</text><text class="h" x="70" y="98" text-anchor="middle">Token</text><text class="s" x="70" y="130" text-anchor="middle">首包可以开始</text></g>
  <g transform="translate(892 244)"><rect class="node" width="140" height="170" rx="16"/><circle class="n" cx="24" cy="24" r="15"/><text class="nt" x="24" y="29" text-anchor="middle" fill="#FFFFFF">6</text><text class="h" x="70" y="78" text-anchor="middle">Decode</text><text class="s" x="70" y="106" text-anchor="middle">逐 token 循环</text><text class="s" x="70" y="134" text-anchor="middle">持续流式返回</text></g>
  <g transform="translate(1056 244)"><rect class="strong" width="140" height="170" rx="16"/><circle class="n" cx="24" cy="24" r="15"/><text class="nt" x="24" y="29" text-anchor="middle" fill="#FFFFFF">7</text><text class="h" x="70" y="78" text-anchor="middle">Response</text><text class="s" x="70" y="106" text-anchor="middle">结束流</text><text class="s" x="70" y="134" text-anchor="middle">返回 usage</text></g>
  <path class="flow" d="M212 329H230"/><path d="M230 329l-9 -6v12z" fill="#334155"/><path class="flow" d="M376 329H394"/><path d="M394 329l-9 -6v12z" fill="#334155"/><path class="flow" d="M540 329H558"/><path d="M558 329l-9 -6v12z" fill="#334155"/><path class="flow" d="M704 329H722"/><path d="M722 329l-9 -6v12z" fill="#334155"/><path class="flow" d="M868 329H886"/><path d="M886 329l-9 -6v12z" fill="#334155"/><path class="flow" d="M1032 329H1050"/><path d="M1050 329l-9 -6v12z" fill="#334155"/>
  <rect x="356" y="452" width="568" height="38" rx="19" fill="#FFFFFF" stroke="#CBD5E1"/><text class="s" x="640" y="477" text-anchor="middle">等待发生在计算前 · 首个 token 只标志流式响应开始</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">一次请求不是一个黑盒，而是一条可以逐段观察的生命周期。</text>
</svg>
