<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-2 启动服务并完成第一次调用</title>
  <desc id="fig-desc">展示第一次实验从启动服务、确认接口就绪、发送单请求到观察流式响应的四步闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.step{font-size:14px;font-weight:750;letter-spacing:1px;fill:#64748B}.stepdark{font-size:14px;font-weight:750;letter-spacing:1px;fill:#CBD5E1}
      .h{font-size:20px;font-weight:750}.hd{font-size:20px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.code{fill:#E2E8F0}.codet{font-size:14px;font-weight:700;fill:#475569}
      .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.note{fill:#E2E8F0}.notet{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">FIRST RUN · 02</text>
  <text class="t" x="56" y="84">启动服务并完成第一次调用</text>
  <text class="sub" x="56" y="114">四个动作构成最小闭环：启动、确认、调用、观察</text>

  <g transform="translate(56 184)">
    <rect class="card" width="252" height="330" rx="20"/>
    <text class="step" x="24" y="42">START · 01</text>
    <text class="h" x="24" y="84">Terminal A</text>
    <text class="s" x="24" y="116">启动服务</text>
    <rect class="code" x="24" y="150" width="204" height="54" rx="12"/>
    <text class="codet" x="126" y="183" text-anchor="middle">start_vllm.py</text>
    <text class="s" x="24" y="244">模型加载</text>
    <text class="s" x="24" y="274">端口监听</text>
  </g>
  <g transform="translate(350 184)">
    <rect class="dark" width="252" height="330" rx="20"/>
    <text class="stepdark" x="24" y="42" fill="#CBD5E1">READY · 02</text>
    <text class="hd" x="24" y="84" fill="#FFFFFF">确认 API 就绪</text>
    <text class="sd" x="24" y="116" fill="#CBD5E1">不要只看进程状态</text>
    <rect x="24" y="150" width="204" height="54" rx="12" fill="#FFFFFF"/>
    <text class="codet" x="126" y="183" text-anchor="middle">/v1/models</text>
    <text class="sd" x="24" y="244" fill="#CBD5E1">返回模型信息</text>
    <text class="sd" x="24" y="274" fill="#CBD5E1">API ready</text>
  </g>
  <g transform="translate(644 184)">
    <rect class="card" width="252" height="330" rx="20"/>
    <text class="step" x="24" y="42">CALL · 03</text>
    <text class="h" x="24" y="84">Terminal B</text>
    <text class="s" x="24" y="116">发出流式请求</text>
    <rect class="code" x="24" y="150" width="204" height="54" rx="12"/>
    <text class="codet" x="126" y="183" text-anchor="middle">demo.py</text>
    <text class="s" x="24" y="244">1 request</text>
    <text class="s" x="24" y="274">1 concurrency</text>
  </g>
  <g transform="translate(938 184)">
    <rect class="dark" width="286" height="330" rx="20"/>
    <text class="stepdark" x="24" y="42" fill="#CBD5E1">OBSERVE · 04</text>
    <text class="hd" x="24" y="84" fill="#FFFFFF">看到完整流</text>
    <text class="sd" x="24" y="116" fill="#CBD5E1">客户端观察结果</text>
    <rect x="24" y="150" width="238" height="54" rx="12" fill="#FFFFFF"/>
    <text class="codet" x="143" y="183" text-anchor="middle">first chunk</text>
    <text class="sd" x="24" y="244" fill="#CBD5E1">more chunks</text>
    <text class="sd" x="24" y="274" fill="#CBD5E1">usage + done</text>
  </g>
  <path class="flow" d="M308 349H344"/><path d="M344 349l-9 -6v12z" fill="#334155"/>
  <path class="flow" d="M602 349H638"/><path d="M638 349l-9 -6v12z" fill="#334155"/>
  <path class="flow" d="M896 349H932"/><path d="M932 349l-9 -6v12z" fill="#334155"/>

  <rect class="note" x="332" y="548" width="616" height="44" rx="22"/>
  <text class="notet" x="640" y="576" text-anchor="middle">本章只做单请求链路验证，不做并发压测与性能排名</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/>
  <text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text>
  <text class="tv" x="184" y="676" fill="#FFFFFF">进程启动不等于服务就绪，第一次调用必须经过独立的 ready 检查。</text>
</svg>
