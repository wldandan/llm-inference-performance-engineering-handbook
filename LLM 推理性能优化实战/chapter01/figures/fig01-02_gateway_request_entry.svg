<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-2 Gateway 请求入口</title><desc id="fig-desc">客户端请求先进入 Gateway，依次完成协议适配、身份与配额检查、参数校验和目标路由，再形成内部请求。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.head{fill:#0F172A}.ht{font-size:21px;font-weight:750;fill:#FFFFFF}.hs{font-size:14px;fill:#CBD5E1}.card{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.3}.h{font-size:17px;font-weight:750}.s{font-size:14px;fill:#64748B}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.label{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">SERVICE ENTRY · 02</text><text class="t" x="56" y="84">Gateway：模型计算开始前的服务入口</text><text class="sub" x="56" y="114">外部 API 请求必须先被翻译成系统可以安全处理的内部请求</text>
  <g transform="translate(56 270)"><rect class="panel" width="220" height="150" rx="18"/><text class="h" x="110" y="58" text-anchor="middle">Client Request</text><text class="s" x="110" y="88" text-anchor="middle">prompt · params</text><text class="s" x="110" y="114" text-anchor="middle">auth · trace ID</text></g>
  <path class="flow" d="M276 345H338"/><path d="M338 345l-11 -7v14z" fill="#334155"/><text class="label" x="307" y="326" text-anchor="middle">API 请求</text>
  <g transform="translate(344 160)"><rect class="panel" width="594" height="388" rx="22"/><path class="head" d="M22 0H572Q594 0 594 22V84H0V22Q0 0 22 0Z"/><text class="ht" x="28" y="37" fill="#FFFFFF">Gateway</text><text class="hs" x="28" y="64" fill="#CBD5E1">服务入口 · 请求尚未进入模型计算</text>
    <g transform="translate(30 118)"><rect class="card" width="250" height="96" rx="14"/><text class="h" x="20" y="34">1 · 协议适配</text><text class="s" x="20" y="63">解析请求与流式响应格式</text></g>
    <g transform="translate(314 118)"><rect class="card" width="250" height="96" rx="14"/><text class="h" x="20" y="34">2 · 鉴权与配额</text><text class="s" x="20" y="63">确认身份和入口资源限制</text></g>
    <g transform="translate(30 242)"><rect class="card" width="250" height="96" rx="14"/><text class="h" x="20" y="34">3 · 参数校验</text><text class="s" x="20" y="63">模型名、长度与采样参数</text></g>
    <g transform="translate(314 242)"><rect class="card" width="250" height="96" rx="14"/><text class="h" x="20" y="34">4 · 目标路由</text><text class="s" x="20" y="63">选择可处理请求的服务目标</text></g>
  </g>
  <path class="flow" d="M938 345H1000"/><path d="M1000 345l-11 -7v14z" fill="#334155"/><text class="label" x="969" y="326" text-anchor="middle">内部请求</text>
  <g transform="translate(1006 270)"><rect class="panel" width="218" height="150" rx="18"/><text class="h" x="109" y="58" text-anchor="middle">Queue / Engine</text><text class="s" x="109" y="88" text-anchor="middle">进入等待或执行</text><text class="s" x="109" y="114" text-anchor="middle">模型计算从此后开始</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">协议、鉴权、参数校验和路由都发生在模型计算之前。</text>
</svg>
