<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-4 Prefill 在生命周期中的位置</title><desc id="fig-desc">展示请求被首次调度后，Prefill 一次处理全部输入 token，建立 KV Cache，并为首 token 生成 logits。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.node{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.focus{fill:#0F172A}.h{font-size:20px;font-weight:750}.hl{font-size:22px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sl{font-size:14px;fill:#CBD5E1}.token{fill:#E2E8F0;stroke:#94A3B8;stroke-width:1}.tok{font-size:14px;font-weight:700;fill:#475569}.kv{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.2}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.label{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">FIRST MODEL COMPUTE · 04</text><text class="t" x="56" y="84">Prefill：第一次真正处理模型输入</text><text class="sub" x="56" y="114">请求离开 Queue 后，完整 Prompt 在一次阶段中被编码，并建立后续生成需要的缓存</text>
  <g transform="translate(56 270)"><rect class="node" width="190" height="150" rx="18"/><text class="h" x="95" y="54" text-anchor="middle">Scheduled</text><text class="s" x="95" y="84" text-anchor="middle">首次获得执行机会</text><text class="s" x="95" y="112" text-anchor="middle">Queue 在此结束</text></g>
  <path class="flow" d="M246 345H320"/><path d="M320 345l-11 -7v14z" fill="#334155"/>
  <g transform="translate(326 176)"><rect class="focus" width="522" height="338" rx="22"/><text class="hl" x="30" y="48" fill="#FFFFFF">Prefill</text><text class="sl" x="30" y="76" fill="#CBD5E1">一次处理完整输入序列</text><text class="sl" x="30" y="118" fill="#CBD5E1">PROMPT TOKENS</text>
    <g transform="translate(30 140)"><rect class="token" width="72" height="50" rx="10"/><text class="tok" x="36" y="31" text-anchor="middle">你好</text><rect class="token" x="82" width="72" height="50" rx="10"/><text class="tok" x="118" y="31" text-anchor="middle">请</text><rect class="token" x="164" width="72" height="50" rx="10"/><text class="tok" x="200" y="31" text-anchor="middle">解释</text><rect class="token" x="246" width="72" height="50" rx="10"/><text class="tok" x="282" y="31" text-anchor="middle">LLM</text><rect class="token" x="328" width="72" height="50" rx="10"/><text class="tok" x="364" y="31" text-anchor="middle">...</text></g>
    <path d="M230 210V244" stroke="#CBD5E1" stroke-width="2"/><path d="M230 244l-7 -12h14z" fill="#CBD5E1"/><text class="sl" x="30" y="278" fill="#CBD5E1">Transformer Forward</text><text class="sl" x="30" y="306" fill="#CBD5E1">为每个输入位置计算表示</text>
  </g>
  <path class="flow" d="M848 286H930"/><path d="M930 286l-11 -7v14z" fill="#334155"/><g transform="translate(936 212)"><rect class="node" width="288" height="142" rx="18"/><text class="h" x="24" y="43">KV Cache</text><text class="s" x="24" y="75">写入 Prompt 的 K / V</text><g transform="translate(24 94)"><rect class="kv" width="48" height="24" rx="5"/><rect class="kv" x="54" width="48" height="24" rx="5"/><rect class="kv" x="108" width="48" height="24" rx="5"/><rect class="kv" x="162" width="48" height="24" rx="5"/><rect class="kv" x="216" width="48" height="24" rx="5"/></g></g>
  <path class="flow" d="M848 416H930"/><path d="M930 416l-11 -7v14z" fill="#334155"/><g transform="translate(936 374)"><rect class="node" width="288" height="116" rx="18"/><text class="h" x="24" y="43">Logits → Sampling</text><text class="s" x="24" y="75">准备生成第一个输出 token</text></g>
  <text class="label" x="640" y="552" text-anchor="middle">完整 Prompt → 一次 Prefill → KV Cache + First-token logits</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">Prefill 处理完整输入，并写入 Decode 后续复用的 KV Cache。</text>
</svg>
