<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-5 首个 token 与流式返回</title><desc id="fig-desc">展示服务端生成首 token 后，经 Gateway 组装 chunk 和网络传输，到客户端收到首包并继续消费后续分片。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.node{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.focus{fill:#0F172A}.num{font-size:14px;font-weight:750;fill:#64748B}.h{font-size:19px;font-weight:750}.hl{font-size:20px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sl{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.stream{fill:#E2E8F0}.st{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">STREAMING MILESTONE · 05</text><text class="t" x="56" y="84">首个 token：等待方式发生改变的时刻</text><text class="sub" x="56" y="114">生成首 token、发送首个 chunk、客户端收到首包是连续但不同的事件</text>
  <g transform="translate(56 216)"><rect class="focus" width="244" height="216" rx="20"/><text class="num" x="24" y="34" fill="#CBD5E1">SERVER · 01</text><text class="hl" x="24" y="78" fill="#FFFFFF">First Token</text><text class="sl" x="24" y="108" fill="#CBD5E1">模型生成首个输出 token</text><rect x="24" y="142" width="196" height="44" rx="12" fill="#FFFFFF"/><text class="h" x="122" y="170" text-anchor="middle">“你”</text></g>
  <path class="flow" d="M300 324H374"/><path d="M374 324l-11 -7v14z" fill="#334155"/>
  <g transform="translate(380 216)"><rect class="node" width="244" height="216" rx="20"/><text class="num" x="24" y="34">GATEWAY · 02</text><text class="h" x="24" y="78">Streaming Chunk</text><text class="s" x="24" y="108">组装协议字段与内容</text><rect class="stream" x="24" y="142" width="196" height="44" rx="12"/><text class="st" x="122" y="170" text-anchor="middle">data: { delta: “你” }</text></g>
  <path class="flow" d="M624 324H698"/><path d="M698 324l-11 -7v14z" fill="#334155"/>
  <g transform="translate(704 216)"><rect class="node" width="196" height="216" rx="20"/><text class="num" x="24" y="34">NETWORK · 03</text><text class="h" x="24" y="78">Transmit</text><text class="s" x="24" y="108">网络与缓冲</text><path d="M40 166H156" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/><path d="M156 166l-11 -7v14z" fill="#94A3B8"/></g>
  <path class="flow" d="M900 324H974"/><path d="M974 324l-11 -7v14z" fill="#334155"/>
  <g transform="translate(980 216)"><rect class="focus" width="244" height="216" rx="20"/><text class="num" x="24" y="34" fill="#CBD5E1">CLIENT · 04</text><text class="hl" x="24" y="78" fill="#FFFFFF">First Chunk</text><text class="sl" x="24" y="108" fill="#CBD5E1">用户开始看到输出</text><rect x="24" y="142" width="196" height="44" rx="12" fill="#FFFFFF"/><text class="h" x="122" y="170" text-anchor="middle">首包到达</text></g>
  <rect class="stream" x="268" y="480" width="744" height="70" rx="16"/><text class="st" x="300" y="510">随后继续流式返回</text><text class="st" x="505" y="510">token 2</text><text class="st" x="665" y="510">token 3</text><text class="st" x="825" y="510">...</text><path class="flow" d="M450 530H930"/><path d="M930 530l-11 -7v14z" fill="#334155"/>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">首个 chunk 到达后，用户从“等待答案”转为“边等边读”。</text>
</svg>
