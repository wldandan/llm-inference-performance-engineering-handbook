<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-6 Decode Loop</title><desc id="fig-desc">展示 Decode 每轮读取已有 KV Cache，执行一次模型计算、采样一个 token、追加缓存并继续循环，直到结束条件满足。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.node{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.focus{fill:#0F172A}.h{font-size:18px;font-weight:750}.hl{font-size:19px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sl{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#64748B;stroke-width:2.3;stroke-dasharray:8 6;marker-end:url(#arrow)}.badge{fill:#E2E8F0}.bt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">TOKEN-BY-TOKEN · 06</text><text class="t" x="56" y="84">Decode Loop：每一轮只推进一个输出 token</text><text class="sub" x="56" y="114">一条回答不是一次性算完，而是重复执行“读取—计算—采样—追加—返回”</text>
  <g transform="translate(64 250)"><rect class="node" width="190" height="150" rx="18"/><text class="h" x="95" y="54" text-anchor="middle">读取 KV Cache</text><text class="s" x="95" y="86" text-anchor="middle">Prompt + 已生成 token</text><text class="s" x="95" y="114" text-anchor="middle">作为本轮上下文</text></g>
  <path class="flow" d="M254 325H322"/><path d="M322 325l-11 -7v14z" fill="#334155"/>
  <g transform="translate(328 250)"><rect class="focus" width="190" height="150" rx="18"/><text class="hl" x="95" y="54" text-anchor="middle" fill="#FFFFFF">Model Forward</text><text class="sl" x="95" y="86" text-anchor="middle" fill="#CBD5E1">处理当前输入位置</text><text class="sl" x="95" y="114" text-anchor="middle" fill="#CBD5E1">输出下一 token logits</text></g>
  <path class="flow" d="M518 325H586"/><path d="M586 325l-11 -7v14z" fill="#334155"/>
  <g transform="translate(592 250)"><rect class="node" width="190" height="150" rx="18"/><text class="h" x="95" y="54" text-anchor="middle">Sampling</text><text class="s" x="95" y="86" text-anchor="middle">选择一个 token</text><rect class="badge" x="52" y="104" width="86" height="30" rx="15"/><text class="bt" x="95" y="124" text-anchor="middle">token n</text></g>
  <path class="flow" d="M782 325H850"/><path d="M850 325l-11 -7v14z" fill="#334155"/>
  <g transform="translate(856 250)"><rect class="node" width="190" height="150" rx="18"/><text class="h" x="95" y="54" text-anchor="middle">追加并返回</text><text class="s" x="95" y="86" text-anchor="middle">Append K / V</text><text class="s" x="95" y="114" text-anchor="middle">Stream token n</text></g>
  <path class="flow" d="M1046 325H1120"/><path d="M1120 325l-11 -7v14z" fill="#334155"/><g transform="translate(1126 270)"><rect class="node" width="98" height="110" rx="18"/><text class="h" x="49" y="45" text-anchor="middle">结束？</text><text class="s" x="49" y="76" text-anchor="middle">stop / max</text></g>
  <path class="loop" d="M1175 380V486H159V406"/><path d="M159 406l-7 12h14z" fill="#64748B"/><rect class="badge" x="582" y="464" width="116" height="34" rx="17"/><text class="bt" x="640" y="486" text-anchor="middle">未结束：下一轮</text><path class="flow" d="M1175 270V192H1214"/><path d="M1214 192l-11 -7v14z" fill="#334155"/><text class="bt" x="1152" y="176">结束：Finish</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">Decode 是逐 token 循环，回答越长，循环次数通常越多。</text>
</svg>
