<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-8 请求结束与资源回收</title><desc id="fig-desc">展示请求结束时，客户端响应收口与服务端计算、状态和 KV Cache 清理并行发生，最终都必须完成。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.start{fill:#0F172A}.st{font-size:20px;font-weight:750;fill:#FFFFFF}.ss{font-size:14px;fill:#CBD5E1}.lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.lane-title{font-size:15px;font-weight:750;fill:#475569;letter-spacing:1px}.node{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.3}.h{font-size:16px;font-weight:750}.s{font-size:14px;fill:#64748B}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.done{fill:#E2E8F0;stroke:#94A3B8;stroke-width:1.5}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">REQUEST CLOSE · 08</text><text class="t" x="56" y="84">最后一个 token 不是生命周期的最后一步</text><text class="sub" x="56" y="114">响应需要收口，服务端的计算、状态和资源也必须完成交接</text>
  <g transform="translate(56 262)"><rect class="start" width="198" height="168" rx="20"/><text class="st" x="99" y="58" text-anchor="middle" fill="#FFFFFF">Finish Trigger</text><text class="ss" x="99" y="88" text-anchor="middle" fill="#CBD5E1">EOS / stop / max tokens</text><text class="ss" x="99" y="116" text-anchor="middle" fill="#CBD5E1">或客户端取消</text></g>
  <path class="flow" d="M254 320H326V240H386"/><path d="M386 240l-11 -7v14z" fill="#334155"/><path class="flow" d="M254 374H326V480H386"/><path d="M386 480l-11 -7v14z" fill="#334155"/>
  <g transform="translate(392 164)"><rect class="lane" width="600" height="164" rx="18"/><text class="lane-title" x="24" y="34">CLIENT RESPONSE</text><g transform="translate(24 58)"><rect class="node" width="164" height="72" rx="12"/><text class="h" x="82" y="31" text-anchor="middle">返回最后内容</text><text class="s" x="82" y="54" text-anchor="middle">last chunk</text></g><path class="flow" d="M188 94H218"/><path d="M218 94l-9 -6v12z" fill="#334155"/><g transform="translate(224 58)"><rect class="node" width="164" height="72" rx="12"/><text class="h" x="82" y="31" text-anchor="middle">usage / reason</text><text class="s" x="82" y="54" text-anchor="middle">统计与结束原因</text></g><path class="flow" d="M388 94H418"/><path d="M418 94l-9 -6v12z" fill="#334155"/><g transform="translate(424 58)"><rect class="node" width="152" height="72" rx="12"/><text class="h" x="76" y="31" text-anchor="middle">关闭响应流</text><text class="s" x="76" y="54" text-anchor="middle">stream closed</text></g></g>
  <g transform="translate(392 404)"><rect class="lane" width="600" height="164" rx="18"/><text class="lane-title" x="24" y="34">SERVER CLEANUP</text><g transform="translate(24 58)"><rect class="node" width="164" height="72" rx="12"/><text class="h" x="82" y="31" text-anchor="middle">停止调度</text><text class="s" x="82" y="54" text-anchor="middle">stop compute</text></g><path class="flow" d="M188 94H218"/><path d="M218 94l-9 -6v12z" fill="#334155"/><g transform="translate(224 58)"><rect class="node" width="164" height="72" rx="12"/><text class="h" x="82" y="31" text-anchor="middle">清理请求状态</text><text class="s" x="82" y="54" text-anchor="middle">finalize state</text></g><path class="flow" d="M388 94H418"/><path d="M418 94l-9 -6v12z" fill="#334155"/><g transform="translate(424 58)"><rect class="node" width="152" height="72" rx="12"/><text class="h" x="76" y="31" text-anchor="middle">释放 / 复用 KV</text><text class="s" x="76" y="54" text-anchor="middle">resource handoff</text></g></g>
  <path class="flow" d="M992 246H1038V342H1070"/><path d="M1070 342l-11 -7v14z" fill="#334155"/><path class="flow" d="M992 486H1038V374H1070"/><path d="M1070 374l-11 -7v14z" fill="#334155"/><rect class="done" x="1076" y="286" width="148" height="144" rx="18"/><text class="h" x="1150" y="340" text-anchor="middle">Request Closed</text><text class="s" x="1150" y="370" text-anchor="middle">结果已返回</text><text class="s" x="1150" y="396" text-anchor="middle">容量可再使用</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">请求结束既要返回 usage，也要让计算、状态和资源完成收口。</text>
</svg>
