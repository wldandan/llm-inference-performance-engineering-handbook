<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-9 Demo 字段映射到生命周期</title><desc id="fig-desc">把 Demo 输出中的 prompt tokens、TTFT、stream chunks、output tokens 和 total latency 映射到请求生命周期中的对应位置。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.head{fill:#0F172A}.ht{font-size:20px;font-weight:750;fill:#FFFFFF}.hs{font-size:14px;fill:#CBD5E1}.row{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1}.field{font-family:"SFMono-Regular",Consolas,"Liberation Mono","PingFang SC",monospace;font-size:14px;font-weight:700}.meaning{font-size:15px;font-weight:650}.stage{font-size:14px;fill:#64748B}.flow{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">OBSERVE THE DEMO · 09</text><text class="t" x="56" y="84">Demo 输出字段，分别落在生命周期的什么位置</text><text class="sub" x="56" y="114">第 1 章只做字段到现象的映射，不判断数值好坏</text>
  <g transform="translate(64 158)"><rect class="panel" width="438" height="430" rx="20"/><path class="head" d="M20 0H418Q438 0 438 20V74H0V20Q0 0 20 0Z"/><text class="ht" x="24" y="32" fill="#FFFFFF">客户端 Demo 报告</text><text class="hs" x="24" y="57" fill="#CBD5E1">results[0]</text>
    <g transform="translate(20 96)"><rect class="row" width="398" height="54" rx="10"/><text class="field" x="18" y="33">prompt_tokens</text></g><g transform="translate(20 160)"><rect class="row" width="398" height="54" rx="10"/><text class="field" x="18" y="33">ttft_ms</text></g><g transform="translate(20 224)"><rect class="row" width="398" height="54" rx="10"/><text class="field" x="18" y="33">stream_chunks</text></g><g transform="translate(20 288)"><rect class="row" width="398" height="54" rx="10"/><text class="field" x="18" y="33">output_tokens</text></g><g transform="translate(20 352)"><rect class="row" width="398" height="54" rx="10"/><text class="field" x="18" y="33">total_latency_ms</text></g>
  </g>
  <g transform="translate(778 158)"><rect class="panel" width="446" height="430" rx="20"/><path class="head" d="M20 0H426Q446 0 446 20V74H0V20Q0 0 20 0Z"/><text class="ht" x="24" y="32" fill="#FFFFFF">生命周期含义</text><text class="hs" x="24" y="57" fill="#CBD5E1">从客户端可观察到的边界</text>
    <g transform="translate(20 96)"><rect class="row" width="406" height="54" rx="10"/><text class="meaning" x="18" y="24">输入 token 规模</text><text class="stage" x="18" y="45">Prompt → Prefill</text></g><g transform="translate(20 160)"><rect class="row" width="406" height="54" rx="10"/><text class="meaning" x="18" y="24">发出请求到首个流式 token</text><text class="stage" x="18" y="45">Request → First Chunk</text></g><g transform="translate(20 224)"><rect class="row" width="406" height="54" rx="10"/><text class="meaning" x="18" y="24">客户端收到的流式分片数量</text><text class="stage" x="18" y="45">Streaming Response</text></g><g transform="translate(20 288)"><rect class="row" width="406" height="54" rx="10"/><text class="meaning" x="18" y="24">Decode 最终生成的 token 数</text><text class="stage" x="18" y="45">Decode Loop</text></g><g transform="translate(20 352)"><rect class="row" width="406" height="54" rx="10"/><text class="meaning" x="18" y="24">请求完整结束前的总耗时</text><text class="stage" x="18" y="45">Request → Finish</text></g>
  </g>
  <path class="flow" d="M502 281H772"/><path d="M772 281l-11 -7v14z" fill="#334155"/><path class="flow" d="M502 345H772"/><path d="M772 345l-11 -7v14z" fill="#334155"/><path class="flow" d="M502 409H772"/><path d="M772 409l-11 -7v14z" fill="#334155"/><path class="flow" d="M502 473H772"/><path d="M772 473l-11 -7v14z" fill="#334155"/><path class="flow" d="M502 537H772"/><path d="M772 537l-11 -7v14z" fill="#334155"/><text class="stage" x="637" y="252" text-anchor="middle">FIELD → OBSERVATION</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">客户端字段可以映射回生命周期，但还不是性能好坏的结论。</text>
</svg>
