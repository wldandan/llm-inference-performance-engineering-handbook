<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A">
  <title id="fig-title">图 2-1 推理请求生命周期与关键时间点</title><desc id="fig-desc">用 t0 到 t5 六个事件边界闭合 Admission、Queue、Prefill、Decode 和 Response Tail 五个阶段以及端到端时间。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.stage{fill:#E2E8F0}.st{font-size:14px;font-weight:750;fill:#475569}.event{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.6}.edge{fill:#FFFFFF;stroke:#0F172A;stroke-width:2.2}.en{font-size:14px;font-weight:700}.time{font-size:20px;font-weight:750}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.bracket{fill:none;stroke:#64748B;stroke-width:2}.formula{font-size:16px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">EVENT TIMELINE · 01</text><text class="t" x="56" y="84">推理请求生命周期与关键时间点</text><text class="sub" x="56" y="114">阶段时间不是凭感觉切分，而是由一对可以记录的事件边界闭合</text>
  <rect class="stage" x="170" y="180" width="126" height="34" rx="17"/><text class="st" x="233" y="202" text-anchor="middle">Admission</text><rect class="stage" x="365" y="180" width="126" height="34" rx="17"/><text class="st" x="428" y="202" text-anchor="middle">Queue</text><rect class="stage" x="560" y="180" width="126" height="34" rx="17"/><text class="st" x="623" y="202" text-anchor="middle">Prefill</text><rect class="stage" x="755" y="180" width="126" height="34" rx="17"/><text class="st" x="818" y="202" text-anchor="middle">Decode</text><rect class="stage" x="950" y="180" width="150" height="34" rx="17"/><text class="st" x="1025" y="202" text-anchor="middle">Response Tail</text>
  <g transform="translate(44 254)"><rect class="edge" width="166" height="128" rx="16"/><text class="en" x="83" y="42" text-anchor="middle">request_received</text><text class="time" x="83" y="78" text-anchor="middle">t0</text><text class="en" x="83" y="104" text-anchor="middle" fill="#64748B">服务收到请求</text></g>
  <g transform="translate(239 254)"><rect class="event" width="156" height="128" rx="16"/><text class="en" x="78" y="42" text-anchor="middle">queued</text><text class="time" x="78" y="78" text-anchor="middle">t1</text><text class="en" x="78" y="104" text-anchor="middle" fill="#64748B">进入等待</text></g>
  <g transform="translate(434 254)"><rect class="event" width="156" height="128" rx="16"/><text class="en" x="78" y="42" text-anchor="middle">scheduled</text><text class="time" x="78" y="78" text-anchor="middle">t2</text><text class="en" x="78" y="104" text-anchor="middle" fill="#64748B">首次执行</text></g>
  <g transform="translate(629 254)"><rect class="event" width="166" height="128" rx="16"/><text class="en" x="83" y="42" text-anchor="middle">first_token</text><text class="time" x="83" y="78" text-anchor="middle">t3</text><text class="en" x="83" y="104" text-anchor="middle" fill="#64748B">首 token 生成</text></g>
  <g transform="translate(834 254)"><rect class="event" width="156" height="128" rx="16"/><text class="en" x="78" y="42" text-anchor="middle">last_token</text><text class="time" x="78" y="78" text-anchor="middle">t4</text><text class="en" x="78" y="104" text-anchor="middle" fill="#64748B">最后 token</text></g>
  <g transform="translate(1029 254)"><rect class="edge" width="166" height="128" rx="16"/><text class="en" x="83" y="42" text-anchor="middle">finished</text><text class="time" x="83" y="78" text-anchor="middle">t5</text><text class="en" x="83" y="104" text-anchor="middle" fill="#64748B">请求完成</text></g>
  <path class="flow" d="M210 318H233"/><path d="M233 318l-9 -6v12z" fill="#334155"/><path class="flow" d="M395 318H428"/><path d="M428 318l-9 -6v12z" fill="#334155"/><path class="flow" d="M590 318H623"/><path d="M623 318l-9 -6v12z" fill="#334155"/><path class="flow" d="M795 318H828"/><path d="M828 318l-9 -6v12z" fill="#334155"/><path class="flow" d="M990 318H1023"/><path d="M1023 318l-9 -6v12z" fill="#334155"/>
  <path class="bracket" d="M127 430V462H1112V430"/><text class="formula" x="620" y="496" text-anchor="middle">End-to-End = t5 − t0</text><text class="formula" x="620" y="526" text-anchor="middle">每一段 = 右侧事件时间 − 左侧事件时间</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">没有事件边界，就没有可复核的阶段时间。</text>
</svg>
