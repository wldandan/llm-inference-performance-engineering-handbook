  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.box{fill:#fff;stroke:#222;stroke-width:2}.h{font:600 22px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:17px Arial,sans-serif;fill:#444;text-anchor:middle}.l{stroke:#333;stroke-width:2;marker-end:url(#a)}.take{font:600 21px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
