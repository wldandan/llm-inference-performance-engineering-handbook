<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.e{font:600 18px Arial,sans-serif;fill:#111;text-anchor:middle}.l{stroke:#333;stroke-width:2;marker-end:url(#a)}.d{stroke:#666;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#a)}.lab{font:17px Arial,sans-serif;fill:#555;text-anchor:middle}.take{font:600 21px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
