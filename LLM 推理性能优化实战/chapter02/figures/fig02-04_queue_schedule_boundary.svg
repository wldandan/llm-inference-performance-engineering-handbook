<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.h{font:600 22px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:17px Arial,sans-serif;fill:#555;text-anchor:middle}.l{stroke:#333;stroke-width:2;marker-end:url(#a)}.take{font:600 21px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">Queue 与首次调度的边界</text>
  <rect x="80" y="265" width="210" height="92" rx="10" class="b"/><text x="185" y="306" class="h">queued</text><text x="185" y="336" class="s">t1</text>
  <line x1="290" y1="311" x2="390" y2="311" class="l"/>
  <rect x="395" y="205" width="480" height="210" rx="12" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="635" y="248" class="h">Waiting Queue</text>
  <rect x="445" y="286" width="105" height="66" rx="7" class="b"/><text x="497" y="326" class="s">req A</text><rect x="575" y="286" width="105" height="66" rx="7" class="b"/><text x="627" y="326" class="s">req B</text><rect x="705" y="286" width="105" height="66" rx="7" class="b"/><text x="757" y="326" class="s">req C</text>
  <line x1="875" y1="311" x2="970" y2="311" class="l"/>
  <rect x="975" y="265" width="225" height="92" rx="10" class="b"/><text x="1087" y="306" class="h">scheduled</text><text x="1087" y="336" class="s">first time · t2</text>
  <line x1="185" y1="470" x2="1087" y2="470" stroke="#777" stroke-width="2"/><line x1="185" y1="458" x2="185" y2="482" stroke="#777" stroke-width="2"/><line x1="1087" y1="458" x2="1087" y2="482" stroke="#777" stroke-width="2"/><text x="636" y="510" class="h">Queue = t2 - t1</text>
  <rect x="120" y="575" width="1040" height="72" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="620" class="take">Key Takeaway：Queue 由 queued 与首次 scheduled 两个事件闭合</text>
</svg>
