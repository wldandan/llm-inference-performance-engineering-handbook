<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" font-family="Arial, sans-serif" font-size="34" fill="#111">Worker、Runtime 与 GPU 的分层关系</text>
  <g fill="none" stroke="#222" stroke-width="3">
    <rect x="150" y="135" width="980" height="125" rx="8"/><rect x="240" y="310" width="800" height="125" rx="8"/><rect x="330" y="485" width="620" height="105" rx="8"/>
    <path d="M640 260v50M640 435v50"/><path d="M625 295l15 18 15-18M625 470l15 18 15-18"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111" text-anchor="middle">
    <text x="640" y="190" font-size="30">Worker</text><text x="640" y="225" font-size="21">模型权重 / 请求状态 / KV Cache 管理</text>
    <text x="640" y="365" font-size="30">Runtime</text><text x="640" y="400" font-size="21">kernel / graph / engine / sampling</text>
    <text x="640" y="548" font-size="30">GPU</text>
  </g>
  <text x="64" y="650" font-family="Arial, sans-serif" font-size="24" fill="#111">Key Takeaway: Worker 持有服务状态，Runtime 负责执行路径，GPU 承担计算和显存压力。</text>
</svg>
