<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A">
  <title id="fig-title">图 2-6 Decode step 与 KV Cache 增长</title><desc id="fig-desc">对齐展示一条请求跨越多轮 Engine Iteration，每轮生成一个 token 并向 KV Cache 追加一个位置。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.label{font-size:14px;font-weight:750;letter-spacing:1px;fill:#475569}.step{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.focus{fill:#0F172A}.h{font-size:18px;font-weight:750}.hl{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sl{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.align{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 6}.kv{fill:#E2E8F0;stroke:#94A3B8;stroke-width:1}.new{fill:#FFFFFF;stroke:#0F172A;stroke-width:1.7}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">ITERATIONS + STATE · 06</text><text class="t" x="56" y="84">Decode 是一串引擎步，KV Cache 随每一步增长</text><text class="sub" x="56" y="114">同一请求会多次进入 Engine Iteration；阶段中也可能存在等待、暂停或抢占间隙</text>
  <text class="label" x="56" y="174">REQUEST TIMELINE</text>
  <g transform="translate(56 202)"><rect class="focus" width="238" height="116" rx="18"/><text class="hl" x="119" y="46" text-anchor="middle" fill="#FFFFFF">First Token</text><text class="sl" x="119" y="78" text-anchor="middle" fill="#CBD5E1">Prefill 完成</text></g><path class="flow" d="M294 260H338"/><path d="M338 260l-10 -6v12z" fill="#334155"/>
  <g transform="translate(344 202)"><rect class="step" width="238" height="116" rx="18"/><text class="h" x="119" y="44" text-anchor="middle">Decode Step 1</text><text class="s" x="119" y="76" text-anchor="middle">生成 token 2 · Append K/V</text></g><path class="flow" d="M582 260H626"/><path d="M626 260l-10 -6v12z" fill="#334155"/>
  <g transform="translate(632 202)"><rect class="step" width="238" height="116" rx="18"/><text class="h" x="119" y="44" text-anchor="middle">Decode Step 2</text><text class="s" x="119" y="76" text-anchor="middle">生成 token 3 · Append K/V</text></g><path class="flow" d="M870 260H914"/><path d="M914 260l-10 -6v12z" fill="#334155"/>
  <g transform="translate(920 202)"><rect class="step" width="304" height="116" rx="18"/><text class="h" x="152" y="44" text-anchor="middle">Decode Step N</text><text class="s" x="152" y="76" text-anchor="middle">生成 last token · 进入终态</text></g>
  <line class="align" x1="175" y1="318" x2="175" y2="404"/><line class="align" x1="463" y1="318" x2="463" y2="404"/><line class="align" x1="751" y1="318" x2="751" y2="404"/><line class="align" x1="1072" y1="318" x2="1072" y2="404"/>
  <text class="label" x="56" y="392">KV CACHE GROWS</text>
  <g transform="translate(92 420)"><rect class="kv" width="166" height="62" rx="10"/><text class="s" x="83" y="38" text-anchor="middle">prompt KV</text></g>
  <g transform="translate(360 420)"><rect class="kv" width="166" height="62" rx="10"/><rect class="new" x="174" width="46" height="62" rx="10"/><text class="s" x="110" y="92" text-anchor="middle">+ token 2</text></g>
  <g transform="translate(626 420)"><rect class="kv" width="166" height="62" rx="10"/><rect class="new" x="174" width="46" height="62" rx="10"/><rect class="new" x="228" width="46" height="62" rx="10"/><text class="s" x="137" y="92" text-anchor="middle">+ token 3</text></g>
  <g transform="translate(912 420)"><rect class="kv" width="166" height="62" rx="10"/><rect class="new" x="174" width="46" height="62" rx="10"/><rect class="new" x="228" width="46" height="62" rx="10"/><rect class="new" x="282" width="46" height="62" rx="10"/><text class="s" x="164" y="92" text-anchor="middle">持续增长至 last token</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">一条请求跨越多轮执行，Decode 区间也可能包含执行间隙。</text>
</svg>
