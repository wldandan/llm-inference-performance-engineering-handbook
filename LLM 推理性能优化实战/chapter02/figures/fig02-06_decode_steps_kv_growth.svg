<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.h{font:600 20px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:16px Arial,sans-serif;fill:#555;text-anchor:middle}.l{stroke:#333;stroke-width:2;marker-end:url(#a)}.kv{fill:#eee;stroke:#555;stroke-width:1.5}.take{font:600 21px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">Decode step 与 KV Cache 增长</text>
  <text x="80" y="165" class="h">Request Timeline</text>
  <rect x="110" y="205" width="170" height="78" rx="8" class="b"/><text x="195" y="252" class="h">First Token</text>
  <rect x="350" y="205" width="170" height="78" rx="8" class="b"/><text x="435" y="239" class="h">Decode Step 1</text><text x="435" y="264" class="s">token 2</text>
  <rect x="590" y="205" width="170" height="78" rx="8" class="b"/><text x="675" y="239" class="h">Decode Step 2</text><text x="675" y="264" class="s">token 3</text>
  <rect x="830" y="205" width="170" height="78" rx="8" class="b"/><text x="915" y="239" class="h">Decode Step N</text><text x="915" y="264" class="s">last token</text>
  <line x1="280" y1="244" x2="346" y2="244" class="l"/><line x1="520" y1="244" x2="586" y2="244" class="l"/><line x1="760" y1="244" x2="826" y2="244" class="l"/>
  <text x="640" y="352" class="h">KV Cache</text>
  <g transform="translate(155 385)"><rect width="80" height="58" class="kv"/><text x="40" y="35" class="s">prompt</text></g>
  <g transform="translate(365 385)"><rect width="80" height="58" class="kv"/><rect x="82" width="38" height="58" class="kv"/><text x="60" y="82" class="s">+1 token</text></g>
  <g transform="translate(585 385)"><rect width="80" height="58" class="kv"/><rect x="82" width="38" height="58" class="kv"/><rect x="122" width="38" height="58" class="kv"/><text x="80" y="82" class="s">+1 token</text></g>
  <g transform="translate(805 385)"><rect width="80" height="58" class="kv"/><rect x="82" width="38" height="58" class="kv"/><rect x="122" width="38" height="58" class="kv"/><rect x="162" width="38" height="58" class="kv"/><rect x="202" width="38" height="58" class="kv"/><text x="120" y="82" class="s">grows with output</text></g>
  <rect x="120" y="575" width="1040" height="72" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="620" class="take">Key Takeaway：一条请求跨越多轮执行，Decode 区间也可能包含暂停</text>
</svg>
