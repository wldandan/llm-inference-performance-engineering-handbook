<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.h{font:600 20px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:16px Arial,sans-serif;fill:#555;text-anchor:middle}.l{stroke:#333;stroke-width:2;marker-end:url(#a)}.d{fill:none;stroke:#666;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#a)}.take{font:600 21px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">服务端事件与客户端观测</text>
  <text x="105" y="190" class="h">Server Clock</text><line x1="210" y1="180" x2="1150" y2="180" stroke="#333" stroke-width="2"/>
  <rect x="340" y="135" width="210" height="86" rx="8" class="b"/><text x="445" y="170" class="h">First Token</text><text x="445" y="197" class="s">generated</text>
  <line x1="550" y1="178" x2="680" y2="178" class="l"/>
  <rect x="685" y="135" width="210" height="86" rx="8" class="b"/><text x="790" y="170" class="h">First Chunk</text><text x="790" y="197" class="s">sent</text>
  <text x="105" y="420" class="h">Client Clock</text><line x1="210" y1="410" x2="1150" y2="410" stroke="#333" stroke-width="2"/>
  <rect x="225" y="365" width="210" height="86" rx="8" class="b"/><text x="330" y="400" class="h">Request</text><text x="330" y="427" class="s">sent</text>
  <rect x="900" y="365" width="230" height="86" rx="8" class="b"/><text x="1015" y="400" class="h">First Chunk</text><text x="1015" y="427" class="s">received</text>
  <path d="M790 221 C790 300 950 300 1015 361" class="d"/><text x="900" y="300" class="s">network + buffering</text>
  <line x1="640" y1="238" x2="640" y2="350" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/><text x="640" y="330" class="s">Trace ID aligns events</text>
  <rect x="120" y="575" width="1040" height="72" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="620" class="take">Key Takeaway：同名指标也要核对时钟、采集位置和公式</text>
</svg>
