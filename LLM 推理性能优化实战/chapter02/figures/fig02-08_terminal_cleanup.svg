<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.h{font:600 20px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:16px Arial,sans-serif;fill:#555;text-anchor:middle}.l{stroke:#333;stroke-width:2;fill:none;marker-end:url(#a)}.take{font:600 21px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">三类终态与资源清理</text>
  <rect x="80" y="160" width="210" height="72" rx="10" class="b"/><text x="185" y="204" class="h">finished</text>
  <rect x="80" y="285" width="210" height="72" rx="10" class="b"/><text x="185" y="329" class="h">cancelled</text>
  <rect x="80" y="410" width="210" height="72" rx="10" class="b"/><text x="185" y="454" class="h">failed</text>
  <path d="M290 196 C400 196 400 300 485 300" class="l"/><path d="M290 321 L485 321" class="l"/><path d="M290 446 C400 446 400 342 485 342" class="l"/>
  <rect x="490" y="270" width="190" height="100" rx="10" class="b"/><text x="585" y="311" class="h">Stop Compute</text><text x="585" y="340" class="s">close request state</text>
  <line x1="680" y1="320" x2="745" y2="320" class="l"/>
  <rect x="750" y="270" width="190" height="100" rx="10" class="b"/><text x="845" y="311" class="h">Cleanup</text><text x="845" y="340" class="s">log reason + usage</text>
  <line x1="940" y1="320" x2="1005" y2="320" class="l"/>
  <rect x="1010" y="270" width="200" height="100" rx="10" class="b"/><text x="1110" y="311" class="h">Resource Handoff</text><text x="1110" y="340" class="s">release or reuse</text>
  <text x="640" y="505" class="s">Prefix / session cache may be retained only under an explicit owner and policy</text>
  <rect x="120" y="575" width="1040" height="72" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="620" class="take">Key Takeaway：请求终止后，计算、状态和资源都要完成收口</text>
</svg>
