<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A">
  <title id="fig-title">图 2-9 生命周期事件生成阶段报告</title><desc id="fig-desc">JSONL 生命周期事件先按 request id 分组，再校验时间戳、状态转换与终态，最后只计算已闭合区间并生成报告。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.focus{fill:#0F172A}.num{font-size:14px;font-weight:750;fill:#64748B}.numl{font-size:14px;font-weight:750;fill:#CBD5E1}.h{font-size:18px;font-weight:750}.hl{font-size:19px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sl{font-size:14px;fill:#CBD5E1}.code{font-family:"SFMono-Regular",Consolas,"Liberation Mono","PingFang SC",monospace;font-size:14px;fill:#475569}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.note{fill:#E2E8F0}.nt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">EVIDENCE PIPELINE · 09</text><text class="t" x="56" y="84">Demo：生命周期事件如何生成阶段报告</text><text class="sub" x="56" y="114">先确认事件证据完整且顺序合法，再计算已经闭合的时间区间</text>
  <g transform="translate(56 194)"><rect class="card" width="238" height="300" rx="20"/><text class="num" x="24" y="34">INPUT · 01</text><text class="h" x="24" y="70">JSONL Events</text><text class="code" x="24" y="116">request_id</text><text class="code" x="24" y="148">event</text><text class="code" x="24" y="180">ts_ms</text><rect class="note" x="24" y="218" width="190" height="52" rx="12"/><text class="nt" x="119" y="249" text-anchor="middle">一行一个事件</text></g><path class="flow" d="M294 344H342"/><path d="M342 344l-10 -6v12z" fill="#334155"/>
  <g transform="translate(348 194)"><rect class="card" width="238" height="300" rx="20"/><text class="num" x="24" y="34">GROUP · 02</text><text class="h" x="24" y="70">按请求分组</text><text class="s" x="24" y="116">Group by request_id</text><text class="s" x="24" y="148">保留事件顺序</text><text class="s" x="24" y="180">每条请求独立分析</text></g><path class="flow" d="M586 344H634"/><path d="M634 344l-10 -6v12z" fill="#334155"/>
  <g transform="translate(640 178)"><rect class="focus" width="264" height="332" rx="20"/><text class="numl" x="24" y="34" fill="#CBD5E1">VALIDATE · 03</text><text class="hl" x="24" y="70" fill="#FFFFFF">先校验证据</text><text class="sl" x="24" y="116" fill="#CBD5E1">时间戳单调</text><text class="sl" x="24" y="152" fill="#CBD5E1">状态转换合法</text><text class="sl" x="24" y="188" fill="#CBD5E1">终态存在</text><line x1="24" y1="220" x2="240" y2="220" stroke="#334155"/><text class="sl" x="24" y="258" fill="#CBD5E1">不完整或逆序</text><text class="hl" x="24" y="290" fill="#FFFFFF">→ 明确报错</text></g><path class="flow" d="M904 344H952"/><path d="M952 344l-10 -6v12z" fill="#334155"/>
  <g transform="translate(958 194)"><rect class="card" width="266" height="300" rx="20"/><text class="num" x="24" y="34">REPORT · 04</text><text class="h" x="24" y="70">Stage Report</text><text class="code" x="24" y="116">durations_ms</text><text class="code" x="24" y="148">terminal_state</text><text class="code" x="24" y="180">event_count</text><rect class="note" x="24" y="218" width="218" height="52" rx="12"/><text class="nt" x="133" y="249" text-anchor="middle">未知区间 → null</text></g>
  <rect class="note" x="248" y="548" width="784" height="54" rx="14"/><text class="nt" x="640" y="581" text-anchor="middle">缺少事件意味着“未知”，不意味着“零耗时”</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">先验证证据完整性，再计算已经闭合的时间段。</text>
</svg>
