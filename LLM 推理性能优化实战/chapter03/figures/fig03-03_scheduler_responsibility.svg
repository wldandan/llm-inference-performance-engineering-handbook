<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A">
  <title id="fig-title">图 3-3 三层流量决策</title>
  <desc id="fig-desc">用三道依次发生的决策门区分 Router、Admission 与 Engine Scheduler 的问题、输入和输出。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.title{font-size:32px;font-weight:750}.subtitle{font-size:16px;fill:#64748B}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.head{fill:#0F172A}.num{font-size:14px;font-weight:750;fill:#CBD5E1}.question{font-size:22px;font-weight:750;fill:#FFFFFF}.role{font-size:17px;font-weight:700;fill:#CBD5E1}
      .label{font-size:14px;font-weight:750;letter-spacing:1px;fill:#64748B}.value{font-size:17px;font-weight:650}.hint{font-size:14px;fill:#64748B}.output{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.3}.output-text{font-size:16px;font-weight:750}
      .flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.cadence{font-size:14px;font-weight:700;fill:#475569}.take-bg{fill:#0F172A}.take-label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.take{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="kicker" x="56" y="46">DECISION PIPELINE · 03</text>
  <text class="title" x="56" y="84">Router、Admission、Engine Scheduler：三种不同的决策</text>
  <text class="subtitle" x="56" y="114">都可能被叫作“调度”，但回答的问题、输入、频率和输出完全不同</text>

  <g transform="translate(64 166)">
    <rect class="card" width="344" height="406" rx="20"/><path class="head" d="M20 0H324Q344 0 344 20V112H0V20Q0 0 20 0Z"/>
    <text class="num" x="26" y="30" fill="#CBD5E1">DECISION 01</text><text class="question" x="26" y="67" fill="#FFFFFF">去哪里？</text><text class="role" x="26" y="94" fill="#CBD5E1">Router · 目标选择</text>
    <text class="label" x="26" y="148">主要输入</text><text class="value" x="26" y="178">副本健康、模型位置</text><text class="hint" x="26" y="204">placement + health state</text>
    <line x1="26" y1="228" x2="318" y2="228" stroke="#E2E8F0"/>
    <text class="label" x="26" y="260">决策范围</text><text class="value" x="26" y="290">为请求选择目标实例</text>
    <rect class="output" x="24" y="322" width="296" height="58" rx="12"/><text class="label" x="42" y="347">输出</text><text class="output-text" x="104" y="358">Target Replica / Engine</text>
  </g>
  <g transform="translate(468 166)">
    <rect class="card" width="344" height="406" rx="20"/><path class="head" d="M20 0H324Q344 0 344 20V112H0V20Q0 0 20 0Z"/>
    <text class="num" x="26" y="30" fill="#CBD5E1">DECISION 02</text><text class="question" x="26" y="67" fill="#FFFFFF">现在能进吗？</text><text class="role" x="26" y="94" fill="#CBD5E1">Admission · 准入与队列</text>
    <text class="label" x="26" y="148">主要输入</text><text class="value" x="26" y="178">优先级、SLO、配额</text><text class="hint" x="26" y="204">priority + traffic budget</text>
    <line x1="26" y1="228" x2="318" y2="228" stroke="#E2E8F0"/>
    <text class="label" x="26" y="260">决策范围</text><text class="value" x="26" y="290">接受、排队或拒绝</text>
    <rect class="output" x="24" y="322" width="296" height="58" rx="12"/><text class="label" x="42" y="347">输出</text><text class="output-text" x="104" y="358">Accept / Queue / Reject</text>
  </g>
  <g transform="translate(872 166)">
    <rect class="card" width="344" height="406" rx="20"/><path class="head" d="M20 0H324Q344 0 344 20V112H0V20Q0 0 20 0Z"/>
    <text class="num" x="26" y="30" fill="#CBD5E1">DECISION 03</text><text class="question" x="26" y="67" fill="#FFFFFF">下一轮谁运行？</text><text class="role" x="26" y="94" fill="#CBD5E1">Engine Scheduler · 迭代计划</text>
    <text class="label" x="26" y="148">主要输入</text><text class="value" x="26" y="178">活跃序列、Token / KV 预算</text><text class="hint" x="26" y="204">active sequences + resource budget</text>
    <line x1="26" y1="228" x2="318" y2="228" stroke="#E2E8F0"/>
    <text class="label" x="26" y="260">决策范围</text><text class="value" x="26" y="290">组织下一次模型执行</text>
    <rect class="output" x="24" y="322" width="296" height="58" rx="12"/><text class="label" x="42" y="347">输出</text><text class="output-text" x="104" y="358">Iteration Plan</text>
  </g>
  <path class="flow" d="M408 369H462"/><path d="M462 369l-11 -7v14z" fill="#334155"/><path class="flow" d="M812 369H866"/><path d="M866 369l-11 -7v14z" fill="#334155"/>
  <text class="cadence" x="236" y="605" text-anchor="middle">请求级 · 选择一次目标</text><text class="cadence" x="640" y="605" text-anchor="middle">流量级 · 根据压力决策</text><text class="cadence" x="1044" y="605" text-anchor="middle">迭代级 · 高频形成计划</text>

  <rect class="take-bg" x="56" y="642" width="1168" height="54" rx="14"/>
  <text class="take-label" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="take" x="184" y="676" fill="#FFFFFF">三层决策的输入、频率和输出都不同，不能合并成一个“调度器”。</text>
</svg>
