<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.device{fill:#f3f3f3;stroke:#111;stroke-width:2}.h{font:600 24px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:17px Arial,sans-serif;fill:#555;text-anchor:middle}.down{stroke:#333;stroke-width:2;marker-end:url(#a)}.up{stroke:#777;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a)}.take{font:600 20px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">Worker、Runtime 与 Accelerator</text>
  <text x="300" y="135" class="s">Execution Plan</text><text x="980" y="135" class="s">Token / Status</text>
  <rect x="220" y="165" width="840" height="105" rx="10" class="b"/><text x="640" y="207" class="h">Worker</text><text x="640" y="240" class="s">model state · request state · KV handle</text>
  <rect x="300" y="320" width="680" height="105" rx="10" class="b"/><text x="640" y="362" class="h">Runtime</text><text x="640" y="395" class="s">operator · compiled engine · kernel dispatch</text>
  <rect x="380" y="475" width="520" height="78" rx="10" class="device"/><text x="640" y="509" class="h">GPU / Accelerator</text><text x="640" y="537" class="s">tensor compute + device memory</text>
  <line x1="585" y1="270" x2="585" y2="316" class="down"/><line x1="585" y1="425" x2="585" y2="471" class="down"/><line x1="695" y1="475" x2="695" y2="429" class="up"/><line x1="695" y1="320" x2="695" y2="274" class="up"/>
  <rect x="120" y="595" width="1040" height="62" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="634" class="take">Key Takeaway：Worker 是软件执行单元，Accelerator 是硬件资源</text>
</svg>
