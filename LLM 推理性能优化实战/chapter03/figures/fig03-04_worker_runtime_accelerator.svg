<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A">
  <title id="fig-title">图 3-4 Worker、Runtime 与 Accelerator</title>
  <desc id="fig-desc">展示执行计划从 Worker 下沉到 Runtime 和 Accelerator，再由硬件向上返回 token 与执行状态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.title{font-size:32px;font-weight:750}.subtitle{font-size:16px;fill:#64748B}
      .step{fill:#0F172A}.step-num{font-size:16px;font-weight:750;fill:#FFFFFF}.verb{font-size:15px;font-weight:750;fill:#475569;letter-spacing:1px}
      .layer{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.layer-strong{fill:#FFFFFF;stroke:#0F172A;stroke-width:2.2}.role{font-size:22px;font-weight:750}.role-cn{font-size:15px;fill:#64748B}.chip{fill:#F1F5F9}.chip-text{font-size:15px;font-weight:650;fill:#334155}
      .down{fill:none;stroke:#334155;stroke-width:2.6;marker-end:url(#arrow)}.up{fill:none;stroke:#64748B;stroke-width:2.3;stroke-dasharray:7 6;marker-end:url(#arrow-muted)}.flow-label{font-size:14px;font-weight:700;fill:#475569}
      .take-bg{fill:#0F172A}.take-label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.take{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="kicker" x="56" y="46">EXECUTION STACK · 04</text>
  <text class="title" x="56" y="84">Worker、Runtime 与 Accelerator：计划如何变成计算</text>
  <text class="subtitle" x="56" y="114">三个层次不是同一个“GPU Worker”：它们分别管理、组织和执行</text>

  <circle class="step" cx="112" cy="218" r="24"/><text class="step-num" x="112" y="224" text-anchor="middle" fill="#FFFFFF">01</text><text class="verb" x="112" y="260" text-anchor="middle">管理状态</text>
  <rect class="layer-strong" x="190" y="158" width="822" height="120" rx="18"/>
  <text class="role" x="222" y="200">Worker</text><text class="role-cn" x="222" y="228">软件执行单元 · model and request state owner</text>
  <rect class="chip" x="602" y="188" width="114" height="38" rx="19"/><text class="chip-text" x="659" y="212" text-anchor="middle">模型状态</text>
  <rect class="chip" x="730" y="188" width="114" height="38" rx="19"/><text class="chip-text" x="787" y="212" text-anchor="middle">请求状态</text>
  <rect class="chip" x="858" y="188" width="122" height="38" rx="19"/><text class="chip-text" x="919" y="212" text-anchor="middle">KV Handle</text>

  <circle class="step" cx="112" cy="380" r="24"/><text class="step-num" x="112" y="386" text-anchor="middle" fill="#FFFFFF">02</text><text class="verb" x="112" y="422" text-anchor="middle">组织执行</text>
  <rect class="layer" x="250" y="320" width="762" height="120" rx="18"/>
  <text class="role" x="282" y="362">Runtime</text><text class="role-cn" x="282" y="390">执行运行时 · operator and kernel dispatch</text>
  <rect class="chip" x="650" y="350" width="108" height="38" rx="19"/><text class="chip-text" x="704" y="374" text-anchor="middle">算子图</text>
  <rect class="chip" x="772" y="350" width="116" height="38" rx="19"/><text class="chip-text" x="830" y="374" text-anchor="middle">编译引擎</text>
  <rect class="chip" x="902" y="350" width="78" height="38" rx="19"/><text class="chip-text" x="941" y="374" text-anchor="middle">Kernel</text>

  <circle class="step" cx="112" cy="542" r="24"/><text class="step-num" x="112" y="548" text-anchor="middle" fill="#FFFFFF">03</text><text class="verb" x="112" y="584" text-anchor="middle">执行计算</text>
  <rect class="layer-strong" x="310" y="482" width="702" height="120" rx="18"/>
  <text class="role" x="342" y="524">GPU / Accelerator</text><text class="role-cn" x="342" y="552">硬件资源 · tensor compute and device memory</text>
  <rect class="chip" x="758" y="512" width="104" height="38" rx="19"/><text class="chip-text" x="810" y="536" text-anchor="middle">张量计算</text>
  <rect class="chip" x="876" y="512" width="104" height="38" rx="19"/><text class="chip-text" x="928" y="536" text-anchor="middle">设备内存</text>

  <path class="down" d="M1060 214V370H1020"/><path d="M1020 370l12 -7v14z" fill="#334155"/><text class="flow-label" x="1080" y="297">Execution Plan</text>
  <path class="down" d="M1060 376V532H1020"/><path d="M1020 532l12 -7v14z" fill="#334155"/><text class="flow-label" x="1080" y="459">Kernel Dispatch</text>
  <path class="up" d="M1156 532V214H1020"/><path d="M1020 214l12 -7v14z" fill="#64748B"/><text class="flow-label" x="1176" y="382">Token / Status</text>

  <rect class="take-bg" x="56" y="642" width="1168" height="54" rx="14"/>
  <text class="take-label" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="take" x="184" y="676" fill="#FFFFFF">Worker 是软件执行单元，Accelerator 是承载计算与内存的硬件资源。</text>
</svg>
