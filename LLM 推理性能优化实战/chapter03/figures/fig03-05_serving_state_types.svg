<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.center{fill:#f3f3f3;stroke:#111;stroke-width:2}.h{font:600 23px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:16px Arial,sans-serif;fill:#555;text-anchor:middle}.l{stroke:#555;stroke-width:2;marker-end:url(#a)}.take{font:600 20px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">推理服务同时管理三类状态</text>
  <rect x="70" y="150" width="310" height="250" rx="12" class="b"/><text x="225" y="198" class="h">Request State</text><text x="225" y="250" class="s">prompt · params · trace</text><text x="225" y="290" class="s">progress · cancel · terminal</text><text x="225" y="344" class="s">Owner: Gateway / Engine</text>
  <rect x="485" y="150" width="310" height="250" rx="12" class="b"/><text x="640" y="198" class="h">Execution State</text><text x="640" y="250" class="s">batch · model · sampling</text><text x="640" y="290" class="s">runtime · communication</text><text x="640" y="344" class="s">Owner: Scheduler / Worker</text>
  <rect x="900" y="150" width="310" height="250" rx="12" class="b"/><text x="1055" y="198" class="h">Resource State</text><text x="1055" y="250" class="s">queue · KV blocks · device</text><text x="1055" y="290" class="s">slots · worker health</text><text x="1055" y="344" class="s">Owner: Admission / Worker</text>
  <line x1="225" y1="400" x2="500" y2="492" class="l"/><line x1="640" y1="400" x2="640" y2="477" class="l"/><line x1="1055" y1="400" x2="780" y2="492" class="l"/>
  <rect x="500" y="480" width="280" height="70" rx="10" class="center"/><text x="640" y="510" class="h">Decision + Cleanup</text><text x="640" y="538" class="s">authoritative owner required</text>
  <rect x="120" y="595" width="1040" height="62" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="634" class="take">Key Takeaway：状态副本可以很多，权威拥有者必须明确</text>
</svg>
