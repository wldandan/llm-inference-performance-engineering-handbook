<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A">
  <title id="fig-title">图 3-6 LLM Serving 部署形态</title>
  <desc id="fig-desc">从单体、API 与 Engine 分离、多副本到平台化部署，对比逻辑职责映射和故障边界的变化。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .kicker{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.title{font-size:32px;font-weight:750}.subtitle{font-size:16px;fill:#64748B}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.head{fill:#0F172A}.step{font-size:14px;font-weight:750;fill:#CBD5E1}.pattern{font-size:20px;font-weight:750;fill:#FFFFFF}.pattern-cn{font-size:14px;fill:#CBD5E1}
      .boundary{fill:#F8FAFC;stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:7 6}.unit{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.3}.unit-strong{fill:#E2E8F0;stroke:#94A3B8;stroke-width:1.3}.unit-title{font-size:15px;font-weight:700}.unit-note{font-size:14px;fill:#64748B}.foot{font-size:14px;font-weight:700;fill:#475569}
      .flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.take-bg{fill:#0F172A}.take-label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.take{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="kicker" x="56" y="46">DEPLOYMENT EVOLUTION · 06</text>
  <text class="title" x="56" y="84">同一组逻辑职责，可以映射成不同部署形态</text>
  <text class="subtitle" x="56" y="114">从左到右，变化的是进程与故障边界；职责契约仍然存在</text>

  <g transform="translate(56 158)">
    <rect class="card" width="270" height="448" rx="20"/><path class="head" d="M20 0H250Q270 0 270 20V88H0V20Q0 0 20 0Z"/>
    <text class="step" x="24" y="28" fill="#CBD5E1">PATTERN 01</text><text class="pattern" x="24" y="58" fill="#FFFFFF">Single Unit</text><text class="pattern-cn" x="24" y="80" fill="#CBD5E1">单体部署</text>
    <rect class="boundary" x="24" y="116" width="222" height="260" rx="16"/>
    <rect class="unit" x="44" y="138" width="182" height="44" rx="10"/><text class="unit-title" x="135" y="166" text-anchor="middle">Gateway + Router</text>
    <rect class="unit" x="44" y="194" width="182" height="44" rx="10"/><text class="unit-title" x="135" y="222" text-anchor="middle">Admission + Scheduler</text>
    <rect class="unit" x="44" y="250" width="182" height="44" rx="10"/><text class="unit-title" x="135" y="278" text-anchor="middle">Worker + Runtime</text>
    <rect class="unit-strong" x="44" y="306" width="182" height="44" rx="10"/><text class="unit-title" x="135" y="334" text-anchor="middle">GPU / Accelerator</text>
    <text class="foot" x="135" y="416" text-anchor="middle">一个部署单元 · 一个故障边界</text>
  </g>

  <g transform="translate(354 158)">
    <rect class="card" width="270" height="448" rx="20"/><path class="head" d="M20 0H250Q270 0 270 20V88H0V20Q0 0 20 0Z"/>
    <text class="step" x="24" y="28" fill="#CBD5E1">PATTERN 02</text><text class="pattern" x="24" y="58" fill="#FFFFFF">API / Engine Split</text><text class="pattern-cn" x="24" y="80" fill="#CBD5E1">入口与执行分离</text>
    <rect class="boundary" x="24" y="116" width="222" height="110" rx="16"/><text class="unit-note" x="42" y="143">API PROCESS</text>
    <rect class="unit" x="42" y="158" width="186" height="44" rx="10"/><text class="unit-title" x="135" y="186" text-anchor="middle">Gateway + Router</text>
    <rect class="boundary" x="24" y="246" width="222" height="132" rx="16"/><text class="unit-note" x="42" y="273">ENGINE PROCESS</text>
    <rect class="unit" x="42" y="286" width="186" height="44" rx="10"/><text class="unit-title" x="135" y="314" text-anchor="middle">Scheduler + Worker</text>
    <rect class="unit-strong" x="42" y="338" width="186" height="26" rx="8"/><text class="unit-title" x="135" y="357" text-anchor="middle">Runtime + GPU</text>
    <text class="foot" x="135" y="416" text-anchor="middle">两个进程 · 明确 IPC 边界</text>
  </g>

  <g transform="translate(652 158)">
    <rect class="card" width="270" height="448" rx="20"/><path class="head" d="M20 0H250Q270 0 270 20V88H0V20Q0 0 20 0Z"/>
    <text class="step" x="24" y="28" fill="#CBD5E1">PATTERN 03</text><text class="pattern" x="24" y="58" fill="#FFFFFF">Multi-Replica</text><text class="pattern-cn" x="24" y="80" fill="#CBD5E1">路由到多个执行副本</text>
    <rect class="unit" x="44" y="120" width="182" height="54" rx="12"/><text class="unit-title" x="135" y="153" text-anchor="middle">Router</text>
    <path class="flow" d="M135 174V216H81V238"/><path class="flow" d="M135 216H189V238"/>
    <path d="M81 238l-7 -12h14zM189 238l-7 -12h14z" fill="#334155"/>
    <rect class="boundary" x="24" y="242" width="104" height="138" rx="14"/><text class="unit-note" x="76" y="272" text-anchor="middle">REPLICA A</text><text class="unit-title" x="76" y="310" text-anchor="middle">Scheduler</text><text class="unit-title" x="76" y="336" text-anchor="middle">Worker</text><text class="unit-note" x="76" y="362" text-anchor="middle">Runtime + GPU</text>
    <rect class="boundary" x="142" y="242" width="104" height="138" rx="14"/><text class="unit-note" x="194" y="272" text-anchor="middle">REPLICA B</text><text class="unit-title" x="194" y="310" text-anchor="middle">Scheduler</text><text class="unit-title" x="194" y="336" text-anchor="middle">Worker</text><text class="unit-note" x="194" y="362" text-anchor="middle">Runtime + GPU</text>
    <text class="foot" x="135" y="416" text-anchor="middle">共享入口 · 独立副本边界</text>
  </g>

  <g transform="translate(950 158)">
    <rect class="card" width="274" height="448" rx="20"/><path class="head" d="M20 0H254Q274 0 274 20V88H0V20Q0 0 20 0Z"/>
    <text class="step" x="24" y="28" fill="#CBD5E1">PATTERN 04</text><text class="pattern" x="24" y="58" fill="#FFFFFF">Serving Platform</text><text class="pattern-cn" x="24" y="80" fill="#CBD5E1">平台统一治理多个服务</text>
    <rect class="unit-strong" x="34" y="118" width="206" height="56" rx="12"/><text class="unit-title" x="137" y="143" text-anchor="middle">Control Plane</text><text class="unit-note" x="137" y="164" text-anchor="middle">模型、版本、副本与策略</text>
    <path class="flow" d="M137 174V222"/><path d="M137 222l-7 -12h14z" fill="#334155"/>
    <rect class="boundary" x="24" y="226" width="226" height="154" rx="16"/><text class="unit-note" x="137" y="257" text-anchor="middle">MODEL SERVICE</text>
    <rect class="unit" x="42" y="278" width="190" height="38" rx="10"/><text class="unit-title" x="137" y="303" text-anchor="middle">Gateway + Routing</text>
    <rect class="unit" x="42" y="326" width="90" height="36" rx="9"/><text class="unit-title" x="87" y="350" text-anchor="middle">Replica A</text>
    <rect class="unit" x="142" y="326" width="90" height="36" rx="9"/><text class="unit-title" x="187" y="350" text-anchor="middle">Replica B</text>
    <text class="foot" x="137" y="416" text-anchor="middle">控制面与请求面分离</text>
  </g>

  <path class="flow" d="M326 382H348"/><path d="M348 382l-10 -6v12z" fill="#334155"/><path class="flow" d="M624 382H646"/><path d="M646 382l-10 -6v12z" fill="#334155"/><path class="flow" d="M922 382H944"/><path d="M944 382l-10 -6v12z" fill="#334155"/>
  <rect class="take-bg" x="56" y="642" width="1168" height="54" rx="14"/>
  <text class="take-label" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="take" x="184" y="676" fill="#FFFFFF">部署边界会变化，入口、决策、执行和返回责任仍要可追踪。</text>
</svg>
