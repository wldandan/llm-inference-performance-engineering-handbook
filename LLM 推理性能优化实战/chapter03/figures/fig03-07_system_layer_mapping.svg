<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><style>.t{font:700 32px Arial,sans-serif;fill:#111}.layer{fill:#fff;stroke:#222;stroke-width:2}.tag{fill:#f5f5f5;stroke:#888;stroke-width:1.5}.h{font:600 20px Arial,sans-serif;fill:#111}.s{font:16px Arial,sans-serif;fill:#444;text-anchor:middle}.verb{font:15px Arial,sans-serif;fill:#666;text-anchor:middle}.take{font:600 20px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">成熟系统覆盖不同的架构层级</text>
  <rect x="90" y="130" width="1100" height="115" rx="10" class="layer"/><text x="125" y="167" class="h">Serving Platform</text><text x="215" y="211" class="verb">orchestrates</text><rect x="350" y="158" width="190" height="58" rx="8" class="tag"/><text x="445" y="193" class="s">Ray Serve</text><rect x="575" y="158" width="190" height="58" rx="8" class="tag"/><text x="670" y="193" class="s">KServe</text><rect x="800" y="158" width="250" height="58" rx="8" class="tag"/><text x="925" y="193" class="s">Dynamo Control</text>
  <rect x="90" y="275" width="1100" height="115" rx="10" class="layer"/><text x="125" y="312" class="h">Inference Server</text><text x="215" y="356" class="verb">hosts requests</text><rect x="425" y="303" width="250" height="58" rx="8" class="tag"/><text x="550" y="338" class="s">Triton</text><rect x="720" y="303" width="250" height="58" rx="8" class="tag"/><text x="845" y="338" class="s">Dynamo Frontend</text>
  <rect x="90" y="420" width="1100" height="115" rx="10" class="layer"/><text x="125" y="457" class="h">LLM Engine</text><text x="215" y="501" class="verb">schedules + executes</text><rect x="330" y="448" width="170" height="58" rx="8" class="tag"/><text x="415" y="483" class="s">vLLM</text><rect x="530" y="448" width="170" height="58" rx="8" class="tag"/><text x="615" y="483" class="s">SGLang</text><rect x="730" y="448" width="200" height="58" rx="8" class="tag"/><text x="830" y="483" class="s">TensorRT-LLM</text><rect x="960" y="448" width="170" height="58" rx="8" class="tag"/><text x="1045" y="483" class="s">llama.cpp</text>
  <rect x="120" y="580" width="1040" height="72" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="625" class="take">Key Takeaway：比较系统前，先确认它们是否处于同一抽象层</text>
</svg>
