<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.future{fill:#fafafa;stroke:#888;stroke-width:2;stroke-dasharray:7 6}.h{font:600 20px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:16px Arial,sans-serif;fill:#555;text-anchor:middle}.l{stroke:#333;stroke-width:2;marker-end:url(#a)}.take{font:600 20px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">从模糊现象到可检查的组件边界</text>
  <rect x="70" y="205" width="230" height="180" rx="10" class="b"/><text x="185" y="255" class="h">Symptom</text><text x="185" y="302" class="s">timeout · wrong replica</text><text x="185" y="337" class="s">no dispatch · cancel leak</text>
  <rect x="360" y="205" width="230" height="180" rx="10" class="b"/><text x="475" y="255" class="h">Component / Handoff</text><text x="475" y="302" class="s">Router -> Admission</text><text x="475" y="337" class="s">Scheduler -> Worker</text>
  <rect x="650" y="205" width="230" height="180" rx="10" class="b"/><text x="765" y="255" class="h">Minimal Evidence</text><text x="765" y="302" class="s">Trace ID · target</text><text x="765" y="337" class="s">decision · dispatch event</text>
  <rect x="940" y="205" width="270" height="180" rx="10" class="future"/><text x="1075" y="255" class="h">Later Chapters</text><text x="1075" y="302" class="s">metrics · benchmark</text><text x="1075" y="337" class="s">profiling · optimization</text>
  <line x1="300" y1="295" x2="356" y2="295" class="l"/><line x1="590" y1="295" x2="646" y2="295" class="l"/><line x1="880" y1="295" x2="936" y2="295" class="l"/>
  <text x="620" y="460" class="s">Chapter 3 stops after component ownership and handoff evidence</text>
  <rect x="120" y="575" width="1040" height="72" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="620" class="take">Key Takeaway：没有组件定位，日志、指标和工具只会变成盲查</text>
</svg>
