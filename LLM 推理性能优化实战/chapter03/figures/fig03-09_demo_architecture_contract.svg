<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker><style>.t{font:700 32px Arial,sans-serif;fill:#111}.b{fill:#fff;stroke:#222;stroke-width:2}.mid{fill:#f5f5f5;stroke:#222;stroke-width:2}.h{font:600 21px Arial,sans-serif;fill:#111;text-anchor:middle}.s{font:16px Arial,sans-serif;fill:#555;text-anchor:middle}.l{stroke:#333;stroke-width:2;marker-end:url(#a)}.take{font:600 20px Arial,sans-serif;fill:#222;text-anchor:middle}</style></defs>
  <rect width="1280" height="720" fill="#fff"/><text x="64" y="72" class="t">Demo：把架构图变成可验证契约</text>
  <rect x="70" y="175" width="300" height="310" rx="12" class="b"/><text x="220" y="220" class="h">reference-architecture.json</text><text x="220" y="275" class="s">components + roles</text><text x="220" y="315" class="s">deployment_unit</text><text x="220" y="355" class="s">request / response flows</text><text x="220" y="395" class="s">control / telemetry flows</text>
  <rect x="490" y="175" width="300" height="310" rx="12" class="mid"/><text x="640" y="220" class="h">Contract Validator</text><text x="640" y="275" class="s">required roles</text><text x="640" y="315" class="s">unique IDs + known endpoints</text><text x="640" y="355" class="s">supported flow kinds</text><text x="640" y="395" class="s">complete request / response</text>
  <rect x="910" y="175" width="300" height="310" rx="12" class="b"/><text x="1060" y="220" class="h">Architecture Report</text><text x="1060" y="275" class="s">request_path</text><text x="1060" y="315" class="s">response_path</text><text x="1060" y="355" class="s">deployment_units</text><text x="1060" y="395" class="s">role_contracts</text>
  <line x1="370" y1="330" x2="486" y2="330" class="l"/><line x1="790" y1="330" x2="906" y2="330" class="l"/>
  <rect x="120" y="575" width="1040" height="72" rx="10" fill="#f5f5f5" stroke="#aaa"/><text x="640" y="620" class="take">Key Takeaway：架构可以接受自动检查，而不只是一张静态图片</text>
