  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">KERNEL TIMELINE · 06</text><text class="t" x="56" y="84">Kernel Launch Overhead：固定开销与任务粒度</text><text class="sub" x="56" y="114">同样的启动成本，在长 Kernel 中不显眼，在大量短 Kernel 中会被放大</text>
