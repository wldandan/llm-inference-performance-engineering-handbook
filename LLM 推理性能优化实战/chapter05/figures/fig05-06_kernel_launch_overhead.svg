  <rect class="tag" x="364" y="594" width="552" height="34" rx="17"/><text class="tagt" x="640" y="617" text-anchor="middle">粗估：Kernel Count × Visible Launch Cost</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">Kernel 越短、数量越多，固定提交与调度开销越值得检查。</text>
