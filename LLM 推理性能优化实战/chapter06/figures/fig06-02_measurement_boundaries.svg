<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter06-v2" fill="#0F172A">
  <title id="fig-title">图 6-2 客户端与服务端测量边界</title><desc id="fig-desc">对齐 Client、Server 与 GPU 三条时间泳道，展示客户端端到端、服务端生命周期和 GPU Kernel 区间的不同起止点。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.mid{fill:#475569}.light{fill:#94A3B8}.h{font-size:18px;font-weight:750}.hd{font-size:15px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.axis{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:6 6}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">MEASUREMENT BOUNDARY · 02</text><text class="t" x="56" y="84">客户端与服务端测量边界</text><text class="sub" x="56" y="114">三条泳道共用时间方向，但起点、终点和事件语义不同</text><path class="axis" d="M246 160H1204"/><path d="M1204 160l-9 -6v12z" fill="#334155"/><text class="s" x="224" y="165" text-anchor="end">time</text>
  <g transform="translate(56 190)"><rect class="lane" width="1168" height="112" rx="18"/><text class="h" x="24" y="44">Client</text><text class="s" x="24" y="74">端到端</text><rect class="dark" x="190" y="28" width="170" height="56" rx="12"/><text class="hd" x="275" y="62" text-anchor="middle" fill="#FFFFFF">request sent</text><rect class="mid" x="650" y="28" width="190" height="56" rx="12"/><text class="hd" x="745" y="62" text-anchor="middle" fill="#FFFFFF">first content seen</text><rect class="dark" x="966" y="28" width="160" height="56" rx="12"/><text class="hd" x="1046" y="62" text-anchor="middle" fill="#FFFFFF">response end</text></g>
  <g transform="translate(56 326)"><rect class="lane" width="1168" height="112" rx="18"/><text class="h" x="24" y="44">Server</text><text class="s" x="24" y="74">请求生命周期</text><rect class="dark" x="260" y="28" width="176" height="56" rx="12"/><text class="hd" x="348" y="62" text-anchor="middle" fill="#FFFFFF">request received</text><rect class="mid" x="570" y="28" width="176" height="56" rx="12"/><text class="hd" x="658" y="62" text-anchor="middle" fill="#FFFFFF">first token</text><rect class="dark" x="884" y="28" width="176" height="56" rx="12"/><text class="hd" x="972" y="62" text-anchor="middle" fill="#FFFFFF">request finished</text></g>
  <g transform="translate(56 462)"><rect class="lane" width="1168" height="112" rx="18"/><text class="h" x="24" y="44">GPU</text><text class="s" x="24" y="74">设备执行</text><rect class="light" x="380" y="34" width="118" height="44" rx="10"/><text class="hd" x="439" y="61" text-anchor="middle" fill="#FFFFFF">Kernel</text><rect class="mid" x="516" y="34" width="210" height="44" rx="10"/><text class="hd" x="621" y="61" text-anchor="middle" fill="#FFFFFF">Kernel Execution</text><rect class="light" x="744" y="34" width="118" height="44" rx="10"/><text class="hd" x="803" y="61" text-anchor="middle" fill="#FFFFFF">Kernel</text></g>
  <path class="dash" d="M416 190V574"/><path class="dash" d="M714 190V574"/><path class="dash" d="M1050 190V574"/>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">同名时长只有边界和时钟一致时才能比较。</text>
</svg>
