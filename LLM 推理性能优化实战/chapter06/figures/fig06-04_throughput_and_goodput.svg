<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter06-v2" fill="#0F172A">
  <title id="fig-title">图 6-4 TPS、RPS 与 Goodput</title><desc id="fig-desc">在一个共享墙钟窗口中，分别用输出 token 数、成功请求数和满足 Success 与 SLO 的请求数计算 Output TPS、RPS 与 Goodput。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.req{fill:#E2E8F0}.good{fill:#0F172A}.bad{fill:#FED7AA}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">SYSTEM CAPACITY · 04</text><text class="t" x="56" y="84">TPS、RPS 与 Goodput：分子不同，窗口相同</text><text class="sub" x="56" y="114">并发请求使用同一个共享墙钟窗口，不能相加单请求速度</text>
  <g transform="translate(56 176)"><rect class="card" width="1168" height="158" rx="22"/><text class="h" x="24" y="40">Shared Measurement Window</text><path d="M34 116H1134" stroke="#334155" stroke-width="3"/><path d="M34 102V130M1134 102V130" stroke="#334155" stroke-width="3"/><text class="s" x="34" y="148">earliest start</text><text class="s" x="1134" y="148" text-anchor="end">latest end</text>
    <g transform="translate(158 68)"><rect class="good" width="128" height="30" rx="8"/><rect class="req" x="50" y="38" width="188" height="30" rx="8"/><rect class="bad" x="180" y="-2" width="146" height="30" rx="8"/><rect class="good" x="322" y="38" width="224" height="30" rx="8"/><rect class="req" x="510" width="204" height="30" rx="8"/><rect class="good" x="700" y="38" width="170" height="30" rx="8"/></g></g>
  <path class="flow" d="M292 334V386"/><path d="M292 386l-6 -9h12z" fill="#334155"/><path class="flow" d="M640 334V386"/><path d="M640 386l-6 -9h12z" fill="#334155"/><path class="flow" d="M988 334V386"/><path d="M988 386l-6 -9h12z" fill="#334155"/>
  <g transform="translate(56 392)"><rect class="card" width="306" height="180" rx="20"/><text class="h" x="153" y="42" text-anchor="middle">Output TPS</text><text class="s" x="153" y="82" text-anchor="middle">successful output tokens</text><path d="M72 104H234" stroke="#94A3B8" stroke-width="1.5"/><text class="s" x="153" y="134" text-anchor="middle">shared window seconds</text></g>
  <g transform="translate(487 392)"><rect class="card" width="306" height="180" rx="20"/><text class="h" x="153" y="42" text-anchor="middle">RPS</text><text class="s" x="153" y="82" text-anchor="middle">successful requests</text><path d="M72 104H234" stroke="#94A3B8" stroke-width="1.5"/><text class="s" x="153" y="134" text-anchor="middle">shared window seconds</text></g>
  <g transform="translate(918 392)"><rect class="dark" width="306" height="180" rx="20"/><text class="hd" x="153" y="42" text-anchor="middle" fill="#FFFFFF">Goodput</text><text class="sd" x="153" y="78" text-anchor="middle" fill="#CBD5E1">success AND within SLO</text><path d="M72 104H234" stroke="#64748B" stroke-width="1.5"/><text class="sd" x="153" y="134" text-anchor="middle" fill="#CBD5E1">shared window seconds</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">Throughput 统计完成量，Goodput 只统计成功且达标的有效量。</text>
</svg>
