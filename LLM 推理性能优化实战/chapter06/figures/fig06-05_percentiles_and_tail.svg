<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter06-v2" fill="#0F172A">
  <title id="fig-title">图 6-5 P50、P95 与 P99</title><desc id="fig-desc">将一百个从快到慢排序的请求划分为 P50、P95、P99 和尾部位置，并标出 nearest-rank 与样本量要求。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.mid{fill:#64748B}.light{fill:#CBD5E1}.tail{fill:#FDBA74}.h{font-size:18px;font-weight:750}.s{font-size:14px;fill:#64748B}.axis{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.mark{stroke:#0F172A;stroke-width:2}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">TAIL LATENCY · 05</text><text class="t" x="56" y="84">P50、P95 与 P99：先排序，再按规则取位置</text><text class="sub" x="56" y="114">分位数不是最慢区间的平均值；算法与样本量都属于口径</text>
  <g transform="translate(56 186)"><rect class="card" width="1168" height="258" rx="22"/><text class="h" x="28" y="42">100 Requests · sorted by latency</text><text class="s" x="28" y="70">fast</text><text class="s" x="1140" y="70" text-anchor="end">slow</text>
    <g transform="translate(28 94)"><rect class="light" width="548" height="72" rx="12"/><rect class="mid" x="548" width="494" height="72"/><rect class="dark" x="1042" width="44" height="72"/><rect class="tail" x="1086" width="26" height="72" rx="6"/><text x="274" y="44" text-anchor="middle" font-size="16" font-weight="700">1 … 50</text><text x="795" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">51 … 95</text><text x="1064" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">99</text></g>
    <path class="mark" d="M576 174V208"/><text class="h" x="576" y="236" text-anchor="middle">P50</text><path class="mark" d="M1070 174V208"/><text class="h" x="1070" y="236" text-anchor="middle">P95</text><path class="mark" d="M1114 174V208"/><text class="h" x="1114" y="236" text-anchor="middle">P99</text><text class="s" x="1154" y="212" text-anchor="end">Tail</text></g>
  <path class="axis" d="M320 480H960"/><path d="M960 480l-9 -6v12z" fill="#334155"/><g transform="translate(196 510)"><rect class="tag" width="344" height="62" rx="18"/><text class="tagt" x="172" y="38" text-anchor="middle">nearest-rank: ceil(p / 100 × N)</text></g><g transform="translate(740 510)"><rect class="tag" width="344" height="62" rx="18"/><text class="tagt" x="172" y="38" text-anchor="middle">Always report N + method + bucket</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">分位数要连同样本量、算法和 workload 分桶一起报告。</text>
</svg>
