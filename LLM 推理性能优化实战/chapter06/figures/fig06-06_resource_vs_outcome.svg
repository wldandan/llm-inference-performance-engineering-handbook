<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter06-v2" fill="#0F172A">
  <title id="fig-title">图 6-6 资源指标与结果指标</title><desc id="fig-desc">将 GPU Utilization、Memory、Bandwidth 与 Queue 等资源线索，通过需要验证的因果关系连接到 TTFT、TPS、Goodput 与 Cost 等结果指标。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">EVIDENCE LAYERS · 06</text><text class="t" x="56" y="84">资源指标与结果指标：中间还差因果证据</text><text class="sub" x="56" y="114">GPU 很忙或显存很高，只说明内部状态发生变化</text>
  <g transform="translate(56 174)"><rect class="card" width="380" height="398" rx="22"/><text class="h" x="28" y="44">Resource Signals</text><text class="s" x="28" y="74">用于解释“内部发生什么”</text><g transform="translate(28 108)"><rect class="tag" width="324" height="54" rx="14"/><text class="tagt" x="162" y="34" text-anchor="middle">GPU Utilization / SM Throughput</text><rect class="tag" y="72" width="324" height="54" rx="14"/><text class="tagt" x="162" y="106" text-anchor="middle">GPU Memory / KV Blocks</text><rect class="tag" y="144" width="324" height="54" rx="14"/><text class="tagt" x="162" y="178" text-anchor="middle">HBM Bandwidth / Cache</text><rect class="tag" y="216" width="324" height="54" rx="14"/><text class="tagt" x="162" y="250" text-anchor="middle">Queue Depth / Batch Size</text></g></g>
  <g transform="translate(500 280)"><rect class="dark" width="280" height="182" rx="22"/><text class="hd" x="140" y="54" text-anchor="middle" fill="#FFFFFF">Causal Evidence</text><text class="sd" x="140" y="92" text-anchor="middle" fill="#CBD5E1">same workload</text><text class="sd" x="140" y="120" text-anchor="middle" fill="#CBD5E1">aligned timeline</text><text class="sd" x="140" y="148" text-anchor="middle" fill="#CBD5E1">controlled comparison</text></g>
  <g transform="translate(844 174)"><rect class="card" width="380" height="398" rx="22"/><text class="h" x="28" y="44">Outcome Metrics</text><text class="s" x="28" y="74">用于判断“目标是否达成”</text><g transform="translate(28 108)"><rect class="tag" width="324" height="54" rx="14"/><text class="tagt" x="162" y="34" text-anchor="middle">TTFT / TPOT / E2E</text><rect class="tag" y="72" width="324" height="54" rx="14"/><text class="tagt" x="162" y="106" text-anchor="middle">Output TPS / RPS</text><rect class="tag" y="144" width="324" height="54" rx="14"/><text class="tagt" x="162" y="178" text-anchor="middle">Goodput / Success Rate</text><rect class="tag" y="216" width="324" height="54" rx="14"/><text class="tagt" x="162" y="250" text-anchor="middle">Cost per Good Request</text></g></g>
  <path class="flow" d="M436 371H494"/><path d="M494 371l-9 -6v12z" fill="#64748B"/><path class="flow" d="M780 371H838"/><path d="M838 371l-9 -6v12z" fill="#64748B"/>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">资源变化不能单独证明用户体验或业务产能改善。</text>
</svg>
