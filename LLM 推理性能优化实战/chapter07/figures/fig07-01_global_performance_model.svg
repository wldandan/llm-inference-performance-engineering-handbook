<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">Global Performance Model</title>
  <desc id="desc">从结果、工作负载、执行阶段、资源约束到验证证据的五层全局性能分析闭环。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:20px;font-weight:700}.body{font-size:16px;fill:#475569}.num{font-size:16px;font-weight:700;fill:#FFFFFF}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text x="70" y="72" class="title">Global Performance Model</text>
  <text x="70" y="104" class="sub">从用户结果出发，沿执行链寻找证据；任何一层都不能被跳过</text>
  <g filter="url(#shadow)">
    <rect x="70" y="170" width="200" height="320" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="305" y="170" width="200" height="320" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="540" y="170" width="200" height="320" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="775" y="170" width="200" height="320" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="1010" y="170" width="200" height="320" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/>
  </g>
  <circle cx="105" cy="210" r="20" fill="#2563EB"/><text x="100" y="216" class="num">1</text>
  <text x="95" y="262" class="label">Outcome</text><text x="95" y="300" class="body">TTFT / E2E</text><text x="95" y="330" class="body">Goodput / Cost</text><text x="95" y="360" class="body">Task Success</text>
  <circle cx="340" cy="210" r="20" fill="#0EA5E9"/><text x="335" y="216" class="num">2</text>
  <text x="330" y="262" class="label">Workload</text><text x="330" y="300" class="body">输入 / 输出长度</text><text x="330" y="330" class="body">并发 / 分布</text><text x="330" y="360" class="body">模型 / 硬件</text>
  <circle cx="575" cy="210" r="20" fill="#14B8A6"/><text x="570" y="216" class="num">3</text>
  <text x="565" y="262" class="label">Stage</text><text x="565" y="300" class="body">Queue / Prefill</text><text x="565" y="330" class="body">Decode / Network</text><text x="565" y="360" class="body">Retrieval / Tool</text>
  <circle cx="810" cy="210" r="20" fill="#F59E0B"/><text x="805" y="216" class="num">4</text>
  <text x="800" y="262" class="label">Resource</text><text x="800" y="300" class="body">Compute / Capacity</text><text x="800" y="330" class="body">Bandwidth / Launch</text><text x="800" y="360" class="body">CPU / Network</text>
  <circle cx="1045" cy="210" r="20" fill="#8B5CF6"/><text x="1040" y="216" class="num">5</text>
  <text x="1035" y="262" class="label">Evidence</text><text x="1035" y="300" class="body">Metrics / Logs</text><text x="1035" y="330" class="body">Trace / Profile</text><text x="1035" y="360" class="body">对照实验</text>
  <g stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M270 330 H300"/><path d="M505 330 H535"/><path d="M740 330 H770"/><path d="M975 330 H1005"/><path d="M1110 166 C1110 125 170 125 170 165" stroke-dasharray="8 7"/></g>
  <g fill="#64748B"><path d="M300 330l-10-6v12z"/><path d="M535 330l-10-6v12z"/><path d="M770 330l-10-6v12z"/><path d="M1005 330l-10-6v12z"/><path d="M170 165l-6-10h12z"/></g>
  <text x="496" y="140" class="sub">证据不支持时，回退并重建问题</text>
  <rect x="70" y="570" width="1140" height="86" rx="18" fill="#0F172A"/>
  <text x="100" y="606" class="conclusion">关键结论</text><text x="100" y="636" class="conclusion">先确定结果与负载，再定位阶段和资源，最后用证据确认；资源信号不能越级成为根因。</text>
</svg>
