<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">请求端到端延迟分解</title>
  <desc id="desc">将普通 LLM 请求的端到端延迟分为入口、网关、排队、预处理、Prefill、Decode 和返回阶段。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:17px;font-weight:700}.body{font-size:15px;fill:#475569}.small{font-size:14px;fill:#64748B}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text x="70" y="72" class="title">请求端到端延迟分解</text><text x="70" y="104" class="sub">串行请求可以近似相加，但每一段必须先定义边界</text>
  <rect x="70" y="150" width="1140" height="76" rx="16" fill="#E2E8F0"/><text x="95" y="181" class="label">Client E2E</text><path d="M220 188 H1160" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/><circle cx="220" cy="188" r="7" fill="#2563EB"/><text x="220" y="214" class="small" text-anchor="middle">send</text><text x="1160" y="214" class="small" text-anchor="middle">complete</text>
  <g>
    <rect x="70" y="280" width="130" height="165" rx="16" fill="#DBEAFE" stroke="#93C5FD"/><text x="135" y="324" class="label" text-anchor="middle">Ingress</text><text x="135" y="357" class="body" text-anchor="middle">网络接入</text><text x="135" y="385" class="body" text-anchor="middle">请求读取</text>
    <rect x="215" y="280" width="130" height="165" rx="16" fill="#E0F2FE" stroke="#7DD3FC"/><text x="280" y="324" class="label" text-anchor="middle">Gateway</text><text x="280" y="357" class="body" text-anchor="middle">鉴权 / 路由</text><text x="280" y="385" class="body" text-anchor="middle">Admission</text>
    <rect x="360" y="280" width="130" height="165" rx="16" fill="#FEF3C7" stroke="#FCD34D"/><text x="425" y="324" class="label" text-anchor="middle">Queue</text><text x="425" y="357" class="body" text-anchor="middle">等待容量</text><text x="425" y="385" class="body" text-anchor="middle">等待调度</text>
    <rect x="505" y="280" width="130" height="165" rx="16" fill="#F1F5F9" stroke="#CBD5E1"/><text x="570" y="324" class="label" text-anchor="middle">Preprocess</text><text x="570" y="357" class="body" text-anchor="middle">模板</text><text x="570" y="385" class="body" text-anchor="middle">Tokenization</text>
    <rect x="650" y="280" width="130" height="165" rx="16" fill="#CCFBF1" stroke="#5EEAD4"/><text x="715" y="324" class="label" text-anchor="middle">Prefill</text><text x="715" y="357" class="body" text-anchor="middle">处理输入</text><text x="715" y="385" class="body" text-anchor="middle">建立 KV</text>
    <rect x="795" y="280" width="200" height="165" rx="16" fill="#EDE9FE" stroke="#C4B5FD"/><text x="895" y="324" class="label" text-anchor="middle">Decode</text><text x="895" y="357" class="body" text-anchor="middle">逐 token 生成</text><text x="895" y="385" class="body" text-anchor="middle">输出长度 × 节奏</text>
    <rect x="1010" y="280" width="200" height="165" rx="16" fill="#FCE7F3" stroke="#F9A8D4"/><text x="1110" y="324" class="label" text-anchor="middle">Response / Egress</text><text x="1110" y="357" class="body" text-anchor="middle">序列化 / 流关闭</text><text x="1110" y="385" class="body" text-anchor="middle">网络返回</text>
  </g>
  <g stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"><path d="M200 362 H210"/><path d="M345 362 H355"/><path d="M490 362 H500"/><path d="M635 362 H645"/><path d="M780 362 H790"/><path d="M995 362 H1005"/></g>
  <g fill="#64748B"><path d="M210 362l-9-6v12z"/><path d="M355 362l-9-6v12z"/><path d="M500 362l-9-6v12z"/><path d="M645 362l-9-6v12z"/><path d="M790 362l-9-6v12z"/><path d="M1005 362l-9-6v12z"/></g>
  <text x="640" y="500" class="label" text-anchor="middle">E2E ≈ Σ 串行阶段时间</text><text x="640" y="530" class="body" text-anchor="middle">若存在流式重叠、异步执行或并行分支，改用依赖图</text>
  <rect x="70" y="570" width="1140" height="86" rx="18" fill="#0F172A"/><text x="100" y="606" class="conclusion">关键结论</text><text x="100" y="636" class="conclusion">先把“模型很慢”拆成可测阶段；只有边界清楚且近似串行，阶段耗时才可以直接相加。</text>
</svg>
