<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">TTFT 与 E2E 的两条路径</title>
  <desc id="desc">同一流式请求中，TTFT 在首个内容到达客户端时结束，而 E2E 延伸到剩余生成和响应完成。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.small{font-size:14px;fill:#64748B}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text x="70" y="72" class="title">TTFT 与 E2E 的两条路径</text><text x="70" y="104" class="sub">两者共享前半段，却在首内容与完整响应处使用不同终点</text>
  <g><rect x="70" y="180" width="145" height="92" rx="15" fill="#DBEAFE"/><rect x="235" y="180" width="145" height="92" rx="15" fill="#FEF3C7"/><rect x="400" y="180" width="145" height="92" rx="15" fill="#F1F5F9"/><rect x="565" y="180" width="145" height="92" rx="15" fill="#CCFBF1"/><rect x="730" y="180" width="145" height="92" rx="15" fill="#DDD6FE"/><rect x="895" y="180" width="145" height="92" rx="15" fill="#EDE9FE"/><rect x="1060" y="180" width="150" height="92" rx="15" fill="#FCE7F3"/></g>
  <text x="142" y="220" class="label" text-anchor="middle">Ingress</text><text x="307" y="220" class="label" text-anchor="middle">Queue</text><text x="472" y="220" class="label" text-anchor="middle">Preprocess</text><text x="637" y="220" class="label" text-anchor="middle">Prefill</text><text x="802" y="214" class="label" text-anchor="middle">First Decode</text><text x="802" y="242" class="body" text-anchor="middle">首 token</text><text x="967" y="214" class="label" text-anchor="middle">Remaining</text><text x="967" y="242" class="body" text-anchor="middle">Decode</text><text x="1135" y="214" class="label" text-anchor="middle">Egress</text><text x="1135" y="242" class="body" text-anchor="middle">完成返回</text>
  <g stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"><path d="M215 226 H230"/><path d="M380 226 H395"/><path d="M545 226 H560"/><path d="M710 226 H725"/><path d="M875 226 H890"/><path d="M1040 226 H1055"/></g>
  <g fill="#64748B"><path d="M230 226l-9-6v12z"/><path d="M395 226l-9-6v12z"/><path d="M560 226l-9-6v12z"/><path d="M725 226l-9-6v12z"/><path d="M890 226l-9-6v12z"/><path d="M1055 226l-9-6v12z"/></g>
  <rect x="70" y="330" width="805" height="78" rx="16" fill="#2563EB"/><text x="95" y="363" class="label" fill="#FFFFFF">TTFT 路径</text><text x="95" y="390" class="body" fill="#FFFFFF">send → 首个可消费内容到达客户端</text><path d="M400 369 H830" stroke="#FFFFFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M830 369l-10-6v12z" fill="#FFFFFF"/><text x="842" y="374" class="small">first content</text>
  <rect x="70" y="430" width="1140" height="78" rx="16" fill="#0EA5E9"/><text x="95" y="463" class="label" fill="#FFFFFF">E2E 路径</text><text x="95" y="490" class="body" fill="#FFFFFF">send → 完整响应结束</text><path d="M400 469 H1160" stroke="#FFFFFF" stroke-width="3" marker-end="url(#arrow)"/><path d="M1160 469l-10-6v12z" fill="#FFFFFF"/>
  <rect x="70" y="570" width="1140" height="86" rx="18" fill="#0F172A"/><text x="100" y="606" class="conclusion">关键结论</text><text x="100" y="636" class="conclusion">TTFT 看首响，E2E 还受剩余输出长度和生成节奏影响；同一个“慢”要先确认终点线。</text>
</svg>
