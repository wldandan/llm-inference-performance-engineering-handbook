<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">从阶段时间到候选假设</title>
  <desc id="desc">将排队、Prefill、Decode 和外部依赖阶段依次映射为候选解释与下一步验证证据。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.head{font-size:18px;font-weight:700;fill:#FFFFFF}.label{font-size:17px;font-weight:700}.body{font-size:15px;fill:#475569}.tag{font-size:14px;font-weight:600}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text x="70" y="72" class="title">从阶段时间到候选假设</text><text x="70" y="104" class="sub">阶段耗时说明“时间在哪”，证据才回答“为什么”</text>
  <rect x="70" y="150" width="250" height="55" rx="12" fill="#2563EB"/><text x="195" y="185" class="head" text-anchor="middle">慢阶段 / 现象</text><rect x="365" y="150" width="390" height="55" rx="12" fill="#0EA5E9"/><text x="560" y="185" class="head" text-anchor="middle">候选假设（未确认）</text><rect x="800" y="150" width="410" height="55" rx="12" fill="#8B5CF6"/><text x="1005" y="185" class="head" text-anchor="middle">最低成本验证证据</text>
  <g>
    <rect x="70" y="225" width="250" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="95" y="254" class="label">Queue P95 上升</text><text x="95" y="279" class="body">等待时间占关键路径 55%</text>
    <rect x="365" y="225" width="390" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="390" y="254" class="label">容量 / 调度 / Admission 压力</text><text x="390" y="279" class="tag" fill="#B45309">status: needs_evidence</text>
    <rect x="800" y="225" width="410" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="825" y="254" class="label">waiting requests · batch state</text><text x="825" y="279" class="body">queue wait · admission reason · KV 容量</text>
    <rect x="70" y="310" width="250" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="95" y="339" class="label">Prefill 变长</text><text x="95" y="364" class="body">首响应路径变慢</text>
    <rect x="365" y="310" width="390" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="390" y="339" class="label">输入增加 / 计算或带宽压力</text><text x="390" y="364" class="tag" fill="#B45309">status: needs_evidence</text>
    <rect x="800" y="310" width="410" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="825" y="339" class="label">prompt tokens · prefill trace</text><text x="825" y="364" class="body">算力吞吐 · HBM 带宽 · batch 组成</text>
    <rect x="70" y="395" width="250" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="95" y="424" class="label">Decode 变长</text><text x="95" y="449" class="body">E2E 增长、TTFT 稳定</text>
    <rect x="365" y="395" width="390" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="390" y="424" class="label">输出增加 / 带宽 / 调度空洞</text><text x="390" y="449" class="tag" fill="#B45309">status: needs_evidence</text>
    <rect x="800" y="395" width="410" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="825" y="424" class="label">output tokens · ITL / TPOT</text><text x="825" y="449" class="body">scheduler state · kernel timeline</text>
    <rect x="70" y="480" width="250" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="95" y="509" class="label">Retrieval / Tool 慢</text><text x="95" y="534" class="body">任务 E2E 尾部上升</text>
    <rect x="365" y="480" width="390" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="390" y="509" class="label">外部服务 / 限流 / 超时重试</text><text x="390" y="534" class="tag" fill="#B45309">status: needs_evidence</text>
    <rect x="800" y="480" width="410" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="825" y="509" class="label">dependency trace · timeout</text><text x="825" y="534" class="body">retry count · index / tool service metrics</text>
  </g>
  <g stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"><path d="M320 260 H360"/><path d="M755 260 H795"/><path d="M320 345 H360"/><path d="M755 345 H795"/><path d="M320 430 H360"/><path d="M755 430 H795"/><path d="M320 515 H360"/><path d="M755 515 H795"/></g>
  <g fill="#64748B"><path d="M360 260l-9-6v12z"/><path d="M795 260l-9-6v12z"/><path d="M360 345l-9-6v12z"/><path d="M795 345l-9-6v12z"/><path d="M360 430l-9-6v12z"/><path d="M795 430l-9-6v12z"/><path d="M360 515l-9-6v12z"/><path d="M795 515l-9-6v12z"/></g>
  <rect x="70" y="590" width="1140" height="66" rx="18" fill="#0F172A"/><text x="100" y="630" class="conclusion">关键结论　慢阶段是候选分析入口，不是 Root Cause；每个假设都必须带上可证伪的证据。</text>
</svg>
