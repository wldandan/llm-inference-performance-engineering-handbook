<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">Workload 改变瓶颈</title>
  <desc id="desc">输入长度、输出长度、并发以及 RAG 和 Agent 编排变化会把压力推向不同执行阶段和资源。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.center{font-size:22px;font-weight:700;fill:#FFFFFF}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text x="70" y="72" class="title">Workload 改变瓶颈</text><text x="70" y="104" class="sub">瓶颈是“系统 × 工作负载”的结果，不是模型的永久标签</text>
  <circle cx="640" cy="350" r="112" fill="#0F172A"/><text x="640" y="338" class="center" text-anchor="middle">当前关键阶段</text><text x="640" y="373" class="center" text-anchor="middle">会移动</text>
  <g>
    <rect x="70" y="160" width="330" height="130" rx="18" fill="#FFFFFF" stroke="#93C5FD"/><text x="95" y="200" class="label">输入 token ↑</text><text x="95" y="233" class="body">Prefill 工作量、KV 容量 ↑</text><text x="95" y="261" class="body">候选约束：Compute / Bandwidth</text>
    <rect x="880" y="160" width="330" height="130" rx="18" fill="#FFFFFF" stroke="#C4B5FD"/><text x="905" y="200" class="label">输出 token ↑</text><text x="905" y="233" class="body">Decode 时间、返回流量 ↑</text><text x="905" y="261" class="body">候选约束：Bandwidth / Launch</text>
    <rect x="70" y="395" width="330" height="130" rx="18" fill="#FFFFFF" stroke="#FCD34D"/><text x="95" y="435" class="label">并发 / 流量突发 ↑</text><text x="95" y="468" class="body">Queue、Batch、Scheduler 压力 ↑</text><text x="95" y="496" class="body">单请求问题变成系统问题</text>
    <rect x="880" y="395" width="330" height="130" rx="18" fill="#FFFFFF" stroke="#5EEAD4"/><text x="905" y="435" class="label">RAG / Agent 结构变化</text><text x="905" y="468" class="body">检索、工具、重试、上下文 ↑</text><text x="905" y="496" class="body">关键路径本身可能改变</text>
  </g>
  <g stroke="#64748B" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M400 235 C495 235 505 280 535 305"/><path d="M880 235 C785 235 775 280 745 305"/><path d="M400 460 C495 460 505 415 535 395"/><path d="M880 460 C785 460 775 415 745 395"/></g>
  <g fill="#64748B"><path d="M535 305l-11-3 5-9z"/><path d="M745 305l11-3-5-9z"/><path d="M535 395l-11 3 5 9z"/><path d="M745 395l11 3-5 9z"/></g>
  <rect x="70" y="580" width="1140" height="76" rx="18" fill="#0F172A"/><text x="100" y="613" class="conclusion">关键结论</text><text x="100" y="641" class="conclusion">任何性能结论都要携带模型、硬件、输入/输出、并发与编排条件；条件变化后重新测量。</text>
</svg>
