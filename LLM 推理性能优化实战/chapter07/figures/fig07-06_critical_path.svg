<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">关键路径不是简单求和</title>
  <desc id="desc">并行检索依赖图中，端到端时间沿较慢的关键词检索分支形成关键路径，而不是全部节点耗时之和。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:17px;font-weight:700}.body{font-size:15px;fill:#475569}.metric{font-size:22px;font-weight:700}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><marker id="arrowCritical" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF4444"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text x="70" y="72" class="title">关键路径不是简单求和</text><text x="70" y="104" class="sub">并行分支汇合时，等待最晚完成的必要分支</text>
  <g><rect x="70" y="285" width="150" height="92" rx="16" fill="#DBEAFE" stroke="#93C5FD"/><text x="145" y="324" class="label" text-anchor="middle">Ingress</text><text x="145" y="352" class="body" text-anchor="middle">10 ms</text>
    <rect x="310" y="185" width="205" height="92" rx="16" fill="#FFFFFF" stroke="#94A3B8"/><text x="412" y="224" class="label" text-anchor="middle">Dense Retrieval</text><text x="412" y="252" class="body" text-anchor="middle">100 ms · 非关键</text>
    <rect x="310" y="385" width="205" height="92" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/><text x="412" y="424" class="label" text-anchor="middle">Keyword Retrieval</text><text x="412" y="452" class="body" text-anchor="middle">200 ms · Critical</text>
    <rect x="610" y="285" width="150" height="92" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/><text x="685" y="324" class="label" text-anchor="middle">Merge</text><text x="685" y="352" class="body" text-anchor="middle">20 ms</text>
    <rect x="850" y="285" width="190" height="92" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="3"/><text x="945" y="324" class="label" text-anchor="middle">LLM</text><text x="945" y="352" class="body" text-anchor="middle">300 ms</text>
  </g>
  <g fill="none"><path d="M220 331 C260 331 260 231 305 231" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><path d="M220 331 C260 331 260 431 305 431" stroke="#EF4444" stroke-width="5" marker-end="url(#arrowCritical)"/><path d="M515 231 C565 231 565 311 605 311" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><path d="M515 431 C565 431 565 351 605 351" stroke="#EF4444" stroke-width="5" marker-end="url(#arrowCritical)"/><path d="M760 331 H845" stroke="#EF4444" stroke-width="5" marker-end="url(#arrowCritical)"/></g>
  <g><path d="M305 231l-10-6v12z" fill="#64748B"/><path d="M305 431l-10-6v12z" fill="#EF4444"/><path d="M605 311l-10-6v12z" fill="#64748B"/><path d="M605 351l-10-6v12z" fill="#EF4444"/><path d="M845 331l-10-7v14z" fill="#EF4444"/></g>
  <rect x="1080" y="185" width="130" height="292" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1145" y="230" class="body" text-anchor="middle">节点总和</text><text x="1145" y="264" class="metric" text-anchor="middle">630 ms</text><line x1="1105" y1="292" x2="1185" y2="292" stroke="#CBD5E1"/><text x="1145" y="331" class="body" text-anchor="middle">Critical Path</text><text x="1145" y="365" class="metric" text-anchor="middle" fill="#DC2626">530 ms</text><text x="1145" y="416" class="body" text-anchor="middle">并行重叠</text><text x="1145" y="446" class="metric" text-anchor="middle">100 ms</text>
  <rect x="70" y="570" width="1140" height="86" rx="18" fill="#0F172A"/><text x="100" y="606" class="conclusion">关键结论</text><text x="100" y="636" class="conclusion">端到端时间沿最长依赖路径形成；优化非关键分支，当前 E2E 可能不变。</text>
</svg>
