<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">Demo 输出全局性能报告</title>
  <desc id="desc">离线 Demo 从三类合成依赖图计算关键路径与并行重叠，并输出仍需真实证据验证的候选假设。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:18px;font-weight:700}.body{font-size:15px;fill:#475569}.code{font-size:14px;fill:#334155}.badge{font-size:14px;font-weight:700;fill:#FFFFFF}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text x="70" y="72" class="title">Demo 输出全局性能报告</text><text x="70" y="104" class="sub">可运行、可验证，但明确不是 Benchmark，也不会越权宣布 Root Cause</text>
  <rect x="70" y="155" width="260" height="365" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/><text x="95" y="195" class="label">1 · Synthetic Inputs</text><rect x="95" y="225" width="210" height="62" rx="12" fill="#DBEAFE"/><text x="200" y="263" class="body" text-anchor="middle">LLM Request DAG</text><rect x="95" y="305" width="210" height="62" rx="12" fill="#CCFBF1"/><text x="200" y="343" class="body" text-anchor="middle">RAG DAG</text><rect x="95" y="385" width="210" height="62" rx="12" fill="#EDE9FE"/><text x="200" y="423" class="body" text-anchor="middle">Agent DAG</text><text x="95" y="486" class="code">id · duration_ms · depends_on</text>
  <rect x="390" y="155" width="330" height="365" rx="20" fill="#0F172A"/><text x="420" y="195" class="label" fill="#FFFFFF">2 · performance_model.py</text><text x="420" y="245" class="code" fill="#CBD5E1">validate graph</text><text x="420" y="285" class="code" fill="#CBD5E1">→ reject cycle / unknown ID</text><text x="420" y="345" class="code" fill="#CBD5E1">calculate longest dependency path</text><text x="420" y="385" class="code" fill="#CBD5E1">→ critical_path_ms</text><text x="420" y="445" class="code" fill="#CBD5E1">map stage → hypothesis → evidence</text><rect x="420" y="472" width="185" height="28" rx="14" fill="#B45309"/><text x="512" y="492" class="badge" text-anchor="middle">needs_evidence</text>
  <rect x="780" y="155" width="430" height="365" rx="20" fill="#FFFFFF" stroke="#CBD5E1"/><text x="810" y="195" class="label">3 · Auditable Report</text><text x="810" y="240" class="code">mode: synthetic_global_performance_model</text><line x1="810" y1="265" x2="1180" y2="265" stroke="#E2E8F0"/><text x="810" y="305" class="body">Critical Path</text><text x="810" y="333" class="code">llm_plan → tool_crm → llm_answer</text><text x="810" y="382" class="body">Parallel Overlap</text><text x="810" y="410" class="code">all_node_time − critical_path</text><text x="810" y="459" class="body">Evidence Needed</text><text x="810" y="487" class="code">trace · metrics · workload control</text>
  <g stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"><path d="M330 338 H385"/><path d="M720 338 H775"/></g>
  <g fill="#64748B"><path d="M385 338l-11-7v14z"/><path d="M775 338l-11-7v14z"/></g>
  <rect x="70" y="570" width="1140" height="86" rx="18" fill="#0F172A"/><text x="100" y="606" class="conclusion">关键结论</text><text x="100" y="636" class="conclusion">Demo 只计算输入图的时间结构并列出待验证证据；合成数据不能包装成实测结论。</text>
</svg>
