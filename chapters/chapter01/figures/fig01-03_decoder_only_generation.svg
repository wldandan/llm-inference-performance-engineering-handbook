<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111; }
      .label { font: 600 14px Arial, sans-serif; fill: #111; }
      .note { font: 500 14px Arial, sans-serif; fill: #555; }
      .take { font: 600 21px Arial, sans-serif; fill: #111; }
      .line, .arrow { stroke: #222; stroke-width: 2; fill: none; }
      .frame { stroke: #999; stroke-width: 1.5; fill: none; }
      .box { stroke: #222; stroke-width: 2; fill: none; }
      .dash { stroke: #555; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
      .takebox { stroke: #222; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="64" y="62" class="title">图1-3：Decoder-only Transformer 推理过程</text>
<line x1="64" y1="92" x2="1216" y2="92" class="line"/>
<rect x="64" y="130" width="1152" height="360" class="frame"/>
<rect x="80" y="252" width="135" height="88" class="box"/>
<text x="147.5" y="292" class="label" text-anchor="middle">Prompt</text>
<text x="147.5" y="315" class="label" text-anchor="middle">Tokens</text>
<line x1="225" y1="296" x2="265" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="277" y="252" width="135" height="88" class="box"/>
<text x="344.5" y="292" class="label" text-anchor="middle">Transformer</text>
<text x="344.5" y="315" class="label" text-anchor="middle">Blocks</text>
<line x1="422" y1="296" x2="462" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="474" y="252" width="135" height="88" class="box"/>
<text x="541.5" y="305" class="label" text-anchor="middle">Logits</text>
<line x1="619" y1="296" x2="659" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="671" y="252" width="135" height="88" class="box"/>
<text x="738.5" y="305" class="label" text-anchor="middle">Sampling</text>
<line x1="816" y1="296" x2="856" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="868" y="252" width="135" height="88" class="box"/>
<text x="935.5" y="305" class="label" text-anchor="middle">New Token</text>
<line x1="1013" y1="296" x2="1053" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="1065" y="252" width="135" height="88" class="box"/>
<text x="1132.5" y="292" class="label" text-anchor="middle">Append</text>
<text x="1132.5" y="315" class="label" text-anchor="middle">Context</text>
<path d="M 990 370 C 1070 430, 790 470, 720 360" class="dash" marker-end="url(#arrow)"/>
<text x="865" y="455" class="note" text-anchor="middle">loop / branch</text>
<rect x="64" y="560" width="1152" height="72" class="takebox"/>
<text x="92" y="604" class="take">Key Takeaway: 自回归生成每次预测下一个 token。</text>
</svg>
