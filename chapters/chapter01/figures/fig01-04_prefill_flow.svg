<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111; }
      .label { font: 600 14px Arial, sans-serif; fill: #111; }
      .note { font: 500 14px Arial, sans-serif; fill: #555; }
      .take { font: 600 21px Arial, sans-serif; fill: #111; }
      .line, .arrow { stroke: #222; stroke-width: 2; fill: none; }
      .frame { stroke: #999; stroke-width: 1.5; fill: none; }
      .box { stroke: #222; stroke-width: 2; fill: none; }
      .dash { stroke: #555; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
      .takebox { stroke: #222; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="64" y="62" class="title">图1-4：Prefill 执行过程</text>
<line x1="64" y1="92" x2="1216" y2="92" class="line"/>
<rect x="64" y="130" width="1152" height="360" class="frame"/>
<rect x="80" y="252" width="135" height="88" class="box"/>
<text x="147.5" y="305" class="label" text-anchor="middle">Full Prompt</text>
<line x1="225" y1="296" x2="314" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="326" y="252" width="135" height="88" class="box"/>
<text x="393.5" y="305" class="label" text-anchor="middle">Embedding</text>
<line x1="471" y1="296" x2="560" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="572" y="252" width="135" height="88" class="box"/>
<text x="639.5" y="292" class="label" text-anchor="middle">Attention /</text>
<text x="639.5" y="315" class="label" text-anchor="middle">MLP</text>
<line x1="717" y1="296" x2="806" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="818" y="252" width="135" height="88" class="box"/>
<text x="885.5" y="305" class="label" text-anchor="middle">Write K/V</text>
<line x1="963" y1="296" x2="1052" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="1064" y="252" width="135" height="88" class="box"/>
<text x="1131.5" y="292" class="label" text-anchor="middle">First-token</text>
<text x="1131.5" y="315" class="label" text-anchor="middle">Logits</text>
<rect x="64" y="560" width="1152" height="72" class="takebox"/>
<text x="92" y="604" class="take">Key Takeaway: Prefill 处理完整 prompt，主要影响 TTFT。</text>
</svg>
