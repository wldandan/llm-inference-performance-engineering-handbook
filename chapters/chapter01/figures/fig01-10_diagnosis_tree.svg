<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111; }
      .label { font: 600 14px Arial, sans-serif; fill: #111; }
      .note { font: 500 14px Arial, sans-serif; fill: #555; }
      .take { font: 600 21px Arial, sans-serif; fill: #111; }
      .line, .arrow { stroke: #222; stroke-width: 2; fill: none; }
      .frame { stroke: #999; stroke-width: 1.5; fill: none; }
      .box { stroke: #222; stroke-width: 2; fill: none; }
      .dash { stroke: #555; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
      .takebox { stroke: #222; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="64" y="62" class="title">图1-10：Performance Diagnosis Tree</text>
<line x1="64" y1="92" x2="1216" y2="92" class="line"/>
<rect x="64" y="130" width="1152" height="360" class="frame"/>
<rect x="82" y="252" width="120" height="88" class="box"/>
<text x="142.0" y="292" class="label" text-anchor="middle">First token</text>
<text x="142.0" y="315" class="label" text-anchor="middle">slow?</text>
<line x1="212" y1="296" x2="236" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="248" y="252" width="120" height="88" class="box"/>
<text x="308.0" y="305" class="label" text-anchor="middle">Check TTFT</text>
<line x1="378" y1="296" x2="402" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="414" y="252" width="120" height="88" class="box"/>
<text x="474.0" y="292" class="label" text-anchor="middle">Output</text>
<text x="474.0" y="315" class="label" text-anchor="middle">stalls?</text>
<line x1="544" y1="296" x2="568" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="580" y="252" width="120" height="88" class="box"/>
<text x="640.0" y="305" class="label" text-anchor="middle">Check ITL</text>
<line x1="710" y1="296" x2="734" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="746" y="252" width="120" height="88" class="box"/>
<text x="806.0" y="292" class="label" text-anchor="middle">Concurrency</text>
<text x="806.0" y="315" class="label" text-anchor="middle">worse?</text>
<line x1="876" y1="296" x2="900" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="912" y="252" width="120" height="88" class="box"/>
<text x="972.0" y="292" class="label" text-anchor="middle">Check</text>
<text x="972.0" y="315" class="label" text-anchor="middle">Scheduling</text>
<line x1="1042" y1="296" x2="1066" y2="296" class="arrow" marker-end="url(#arrow)"/>
<rect x="1078" y="252" width="120" height="88" class="box"/>
<text x="1138.0" y="305" class="label" text-anchor="middle">GPU gaps?</text>
<path d="M 990 370 C 1070 430, 790 470, 720 360" class="dash" marker-end="url(#arrow)"/>
<text x="865" y="455" class="note" text-anchor="middle">loop / branch</text>
<rect x="64" y="560" width="1152" height="72" class="takebox"/>
<text x="92" y="604" class="take">Key Takeaway: 诊断从用户现象开始，而不是从优化开关开始。</text>
</svg>
