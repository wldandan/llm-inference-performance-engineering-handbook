<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-1 一次流式请求的两个视角</title>
  <desc id="fig-desc">用上下两条泳道区分客户端观察事件与服务内部粗粒度过程，并说明二者不能逐节点一一对应。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}
      .lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.lanehead{fill:#0F172A}.lh{font-size:18px;font-weight:750;fill:#FFFFFF}.ls{font-size:14px;fill:#CBD5E1}
      .node{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.5}.strong{fill:#FFFFFF;stroke:#0F172A;stroke-width:2}.h{font-size:17px;font-weight:750}.s{font-size:14px;fill:#64748B}
      .flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.cross{fill:none;stroke:#64748B;stroke-width:2.1;stroke-dasharray:7 6;marker-end:url(#arrow-muted)}
      .stream{fill:#E2E8F0}.streamt{font-size:14px;font-weight:750;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">OBSERVATION FIRST · 01</text>
  <text class="t" x="56" y="84">一次流式请求，有客户端与服务端两个视角</text>
  <text class="sub" x="56" y="114">客户端记录协议事件；服务内部经历处理过程，两者有关联但不是逐节点映射</text>

  <rect class="lane" x="56" y="164" width="1168" height="180" rx="20"/>
  <rect class="lanehead" x="56" y="164" width="190" height="180" rx="20"/>
  <path d="M226 164H246V344H226Z" fill="#0F172A"/>
  <text class="lh" x="80" y="236" fill="#FFFFFF">客户端观察</text>
  <text class="ls" x="80" y="268" fill="#CBD5E1">Client timeline</text>

  <path class="flow" d="M292 254H1178"/>
  <path d="M1178 254l-11 -7v14z" fill="#334155"/>
  <g transform="translate(280 204)"><rect class="strong" width="170" height="100" rx="15"/><text class="h" x="85" y="43" text-anchor="middle">发出请求</text><text class="s" x="85" y="71" text-anchor="middle">request start · t0</text></g>
  <g transform="translate(530 204)"><rect class="strong" width="190" height="100" rx="15"/><text class="h" x="95" y="43" text-anchor="middle">首个 chunk</text><text class="s" x="95" y="71" text-anchor="middle">first content · t1</text></g>
  <g transform="translate(795 204)"><rect class="node" width="200" height="100" rx="15"/><text class="h" x="100" y="43" text-anchor="middle">后续 chunks</text><text class="s" x="100" y="71" text-anchor="middle">t2 ... tn</text></g>
  <g transform="translate(1060 204)"><rect class="strong" width="140" height="100" rx="15"/><text class="h" x="70" y="43" text-anchor="middle">流结束</text><text class="s" x="70" y="71" text-anchor="middle">done · tend</text></g>

  <rect class="lane" x="56" y="374" width="1168" height="210" rx="20"/>
  <rect class="lanehead" x="56" y="374" width="190" height="210" rx="20"/>
  <path d="M226 374H246V584H226Z" fill="#0F172A"/>
  <text class="lh" x="80" y="458" fill="#FFFFFF">服务内部</text>
  <text class="ls" x="80" y="490" fill="#CBD5E1">Server preview</text>

  <g transform="translate(280 410)"><rect class="node" width="145" height="90" rx="15"/><text class="h" x="72.5" y="39" text-anchor="middle">接收</text><text class="s" x="72.5" y="65" text-anchor="middle">accept</text></g>
  <g transform="translate(475 410)"><rect class="node" width="145" height="90" rx="15"/><text class="h" x="72.5" y="39" text-anchor="middle">等待</text><text class="s" x="72.5" y="65" text-anchor="middle">wait</text></g>
  <g transform="translate(670 410)"><rect class="strong" width="260" height="90" rx="15"/><text class="h" x="130" y="39" text-anchor="middle">模型执行</text><text class="s" x="130" y="65" text-anchor="middle">model execution</text></g>
  <g transform="translate(1050 410)"><rect class="node" width="150" height="90" rx="15"/><text class="h" x="75" y="39" text-anchor="middle">结束处理</text><text class="s" x="75" y="65" text-anchor="middle">finalize</text></g>
  <path class="flow" d="M425 455H469"/><path d="M469 455l-9 -6v12z" fill="#334155"/>
  <path class="flow" d="M620 455H664"/><path d="M664 455l-9 -6v12z" fill="#334155"/>
  <path class="flow" d="M930 455H1044"/><path d="M1044 455l-9 -6v12z" fill="#334155"/>

  <path class="cross" d="M365 304V404"/><path d="M365 404l-7 -11h14z" fill="#64748B"/>
  <rect class="stream" x="745" y="522" width="300" height="40" rx="20"/>
  <text class="streamt" x="895" y="547" text-anchor="middle">持续流式返回</text>
  <path class="cross" d="M790 522C760 410 680 384 625 310"/><path d="M625 310l-2 13l12 -7z" fill="#64748B"/>
  <path class="cross" d="M930 522C955 430 925 380 895 310"/><path d="M895 310l-2 13l12 -7z" fill="#64748B"/>

  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/>
  <text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text>
  <text class="tv" x="184" y="676" fill="#FFFFFF">客户端看到的是 chunk 事件，不是服务端内部阶段的一一映射。</text>
</svg>
