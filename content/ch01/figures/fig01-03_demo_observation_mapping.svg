<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-3 Demo 字段映射到客户端观察点</title>
  <desc id="fig-desc">把请求开始、首个内容片段、后续内容片段和流结束映射到客户端报告字段，并区分客户端计数与服务端 usage。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.label{font-size:14px;font-weight:750;letter-spacing:1px;fill:#64748B}
      .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.event{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.5}.eventdark{fill:#0F172A}.h{font-size:16px;font-weight:750}.hd{font-size:16px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}
      .axis{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.bracket{fill:none;stroke:#64748B;stroke-width:1.8}.metric{fill:#E2E8F0}.mt{font-size:14px;font-weight:750;fill:#475569}.source{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.3}
      .take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CLIENT EVIDENCE · 03</text>
  <text class="t" x="56" y="84">Demo 字段映射到客户端观察点</text>
  <text class="sub" x="56" y="114">先确认字段由哪些事件产生，再讨论它们是不是正式性能指标</text>

  <rect class="panel" x="56" y="164" width="900" height="420" rx="20"/>
  <text class="label" x="82" y="202">CLIENT TIMELINE</text>
  <path class="axis" d="M126 282H900"/><path d="M900 282l-11 -7v14z" fill="#334155"/>

  <g transform="translate(92 232)"><rect class="eventdark" width="150" height="100" rx="15"/><text class="hd" x="75" y="42" text-anchor="middle" fill="#FFFFFF">request start</text><text class="sd" x="75" y="70" text-anchor="middle" fill="#CBD5E1">t0</text></g>
  <g transform="translate(332 232)"><rect class="eventdark" width="190" height="100" rx="15"/><text class="hd" x="95" y="42" text-anchor="middle" fill="#FFFFFF">first content</text><text class="sd" x="95" y="70" text-anchor="middle" fill="#CBD5E1">chunk · t1</text></g>
  <g transform="translate(612 232)"><rect class="event" width="190" height="100" rx="15"/><text class="h" x="95" y="42" text-anchor="middle">more content</text><text class="s" x="95" y="70" text-anchor="middle">chunks · t2 ... tn</text></g>
  <g transform="translate(836 232)"><rect class="event" width="96" height="100" rx="15"/><text class="h" x="48" y="42" text-anchor="middle">done</text><text class="s" x="48" y="70" text-anchor="middle">tend</text></g>

  <path class="bracket" d="M167 350V374H427V350"/>
  <rect class="metric" x="196" y="356" width="202" height="48" rx="18"/><text class="mt" x="297" y="376" text-anchor="middle"><tspan x="297">time_to_first_</tspan><tspan x="297" dy="17">content_chunk_ms</tspan></text>
  <path class="bracket" d="M427 414V438H707V414"/>
  <rect class="metric" x="482" y="426" width="170" height="36" rx="18"/><text class="mt" x="567" y="449" text-anchor="middle">chunk_interval_*</text>
  <path class="bracket" d="M167 478V502H884V478"/>
  <rect class="metric" x="438" y="490" width="176" height="36" rx="18"/><text class="mt" x="526" y="513" text-anchor="middle">total_latency_ms</text>

  <rect class="panel" x="982" y="164" width="242" height="420" rx="20"/>
  <rect class="eventdark" x="982" y="164" width="242" height="82" rx="20"/><path d="M982 226H1224V246H982Z" fill="#0F172A"/>
  <text class="hd" x="1008" y="207" fill="#FFFFFF">计数来源</text>
  <g transform="translate(1006 276)"><rect class="source" width="194" height="100" rx="14"/><text class="h" x="18" y="38">stream_chunks</text><text class="s" x="18" y="68">客户端计数</text></g>
  <g transform="translate(1006 404)"><rect class="source" width="194" height="126" rx="14"/><text class="h" x="18" y="36">usage</text><text class="s" x="18" y="66">prompt_tokens</text><text class="s" x="18" y="94">output_tokens</text></g>

  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/>
  <text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text>
  <text class="tv" x="184" y="676" fill="#FFFFFF">这些字段描述客户端观察，不足以单独证明服务端根因。</text>
</svg>
