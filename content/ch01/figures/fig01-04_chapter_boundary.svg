<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter01-v2" fill="#0F172A">
  <title id="fig-title">图 1-4 第 1 章只负责跑通与观察</title>
  <desc id="fig-desc">展示第 1 章以启动和流式调用为输入，产出第一次客户端报告，再由后续章节解释生命周期、模型机制、Serving 架构、指标和工作负载。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
      .k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.label{font-size:14px;font-weight:750;letter-spacing:1px;fill:#64748B}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.core{fill:#0F172A}.h{font-size:18px;font-weight:750}.hc{font-size:24px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sc{font-size:15px;fill:#CBD5E1}.tag{fill:#FFFFFF}.tagt{font-size:16px;font-weight:750;fill:#0F172A}
      .flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#F8FAFC"/>
  <text class="k" x="56" y="46">CHAPTER BOUNDARY · 04</text>
  <text class="t" x="56" y="84">第 1 章只负责跑通与观察</text>
  <text class="sub" x="56" y="114">先留下第一份可信的客户端记录，再由后续章节解释内部原因</text>

  <text class="label" x="56" y="178">INPUT</text>
  <g transform="translate(56 208)"><rect class="card" width="238" height="118" rx="18"/><text class="h" x="24" y="48">启动服务</text><text class="s" x="24" y="78">确认 /v1/models</text></g>
  <g transform="translate(56 370)"><rect class="card" width="238" height="118" rx="18"/><text class="h" x="24" y="48">流式调用</text><text class="s" x="24" y="78">1 request · 1 concurrency</text></g>

  <g transform="translate(382 188)">
    <rect class="core" width="360" height="340" rx="24"/>
    <text class="sc" x="32" y="50" fill="#CBD5E1">CHAPTER 1 · CORE</text>
    <text class="hc" x="32" y="96" fill="#FFFFFF">Run + Observe</text>
    <text class="sc" x="32" y="140" fill="#CBD5E1">启动 · 就绪 · 调用 · 观察</text>
    <rect class="tag" x="32" y="188" width="296" height="58" rx="14"/>
    <text class="tagt" x="180" y="224" text-anchor="middle">保存第一次运行报告</text>
    <text class="sc" x="32" y="286" fill="#CBD5E1">此处不判断性能和根因</text>
  </g>

