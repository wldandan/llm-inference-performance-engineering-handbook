<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A">
  <title id="fig-title">图 2-2 业务任务、LLM 调用与推理请求</title><desc id="fig-desc">展示一个业务任务可包含多次 LLM 调用与工具调用，而一次 LLM 调用又可能因失败重试产生多条推理请求。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.task{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.8}.call{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.focus{fill:#0F172A}.label{font-size:14px;font-weight:750;letter-spacing:1px;fill:#64748B}.h{font-size:20px;font-weight:750}.hl{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sl{font-size:14px;fill:#CBD5E1}.req{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.3}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.retry{fill:none;stroke:#64748B;stroke-width:2.1;stroke-dasharray:7 6;marker-end:url(#arrow)}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">REQUEST GRANULARITY · 02</text><text class="t" x="56" y="84">业务任务、LLM 调用与推理请求不是同一个对象</text><text class="sub" x="56" y="114">从外向内逐层展开，生命周期分析追踪的是最内层那条真实推理请求</text>
  <rect class="task" x="56" y="150" width="1168" height="442" rx="24"/><text class="label" x="84" y="184">BUSINESS TASK</text><text class="h" x="84" y="216">回答用户问题并完成业务目标</text>
  <g transform="translate(92 250)"><rect class="call" width="438" height="250" rx="20"/><text class="label" x="24" y="34">LLM CALL 1</text><text class="h" x="24" y="70">第一次模型调用</text><g transform="translate(24 108)"><rect class="focus" width="390" height="100" rx="16"/><text class="hl" x="24" y="42" fill="#FFFFFF">Inference Request 1</text><text class="sl" x="24" y="72" fill="#CBD5E1">一次实际进入推理服务的请求 · finished</text></g></g>
  <g transform="translate(574 250)"><rect class="call" width="614" height="250" rx="20"/><text class="label" x="24" y="34">LLM CALL 2</text><text class="h" x="24" y="70">第二次模型调用 · 包含一次重试</text><g transform="translate(24 108)"><rect class="req" width="240" height="100" rx="16"/><text class="h" x="20" y="42">Inference Request 2</text><text class="s" x="20" y="72">failed</text></g><path class="retry" d="M264 158H334"/><path d="M334 158l-11 -7v14z" fill="#64748B"/><text class="s" x="299" y="142" text-anchor="middle">retry</text><g transform="translate(340 108)"><rect class="focus" width="250" height="100" rx="16"/><text class="hl" x="20" y="42" fill="#FFFFFF">Inference Request 3</text><text class="sl" x="20" y="72" fill="#CBD5E1">finished</text></g></g>
  <path class="flow" d="M311 500V540H632"/><path d="M632 540l-11 -7v14z" fill="#334155"/><rect class="call" x="638" y="514" width="248" height="56" rx="14"/><text class="h" x="762" y="549" text-anchor="middle">Tool Calls</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">本章追踪最内层的 Inference Request，而不是笼统的“业务请求”。</text>
</svg>
