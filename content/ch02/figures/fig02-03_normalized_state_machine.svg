<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A">
  <title id="fig-title">图 2-3 归一化请求状态机</title><desc id="fig-desc">展示正常请求沿 received 到 finished 的主路径推进，同时任一非终态都可能进入 cancelled 或 failed 终态。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.label{font-size:14px;font-weight:750;letter-spacing:1px;fill:#64748B}.state{fill:#FFFFFF;stroke:#94A3B8;stroke-width:1.6}.terminal{fill:#0F172A}.h{font-size:16px;font-weight:750}.hl{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sl{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.busline{fill:none;stroke:#64748B;stroke-width:2.1;stroke-dasharray:7 6}.exception{fill:none;stroke:#64748B;stroke-width:2.1;stroke-dasharray:7 6;marker-end:url(#arrow)}.bus{fill:#E2E8F0}.bt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">NORMALIZED STATES · 03</text><text class="t" x="56" y="84">归一化请求状态机：正常与异常都必须进入终态</text><text class="sub" x="56" y="114">这是课程的统一事件语言，不绑定某个框架的内部类名</text>
  <text class="label" x="56" y="178">MAIN PATH</text>
  <g transform="translate(48 214)"><rect class="state" width="168" height="100" rx="50"/><text class="h" x="84" y="46" text-anchor="middle">received</text><text class="s" x="84" y="72" text-anchor="middle">已接收</text></g><g transform="translate(248 214)"><rect class="state" width="148" height="100" rx="50"/><text class="h" x="74" y="46" text-anchor="middle">queued</text><text class="s" x="74" y="72" text-anchor="middle">等待中</text></g><g transform="translate(428 214)"><rect class="state" width="158" height="100" rx="50"/><text class="h" x="79" y="46" text-anchor="middle">scheduled</text><text class="s" x="79" y="72" text-anchor="middle">首次执行</text></g><g transform="translate(618 214)"><rect class="state" width="168" height="100" rx="50"/><text class="h" x="84" y="46" text-anchor="middle">first_token</text><text class="s" x="84" y="72" text-anchor="middle">开始输出</text></g><g transform="translate(818 214)"><rect class="state" width="158" height="100" rx="50"/><text class="h" x="79" y="46" text-anchor="middle">last_token</text><text class="s" x="79" y="72" text-anchor="middle">输出结束</text></g><g transform="translate(1008 214)"><rect class="terminal" width="168" height="100" rx="50"/><text class="hl" x="84" y="46" text-anchor="middle" fill="#FFFFFF">finished</text><text class="sl" x="84" y="72" text-anchor="middle" fill="#CBD5E1">正常终态</text></g>
  <path class="flow" d="M216 264H242"/><path d="M242 264l-9 -6v12z" fill="#334155"/><path class="flow" d="M396 264H422"/><path d="M422 264l-9 -6v12z" fill="#334155"/><path class="flow" d="M586 264H612"/><path d="M612 264l-9 -6v12z" fill="#334155"/><path class="flow" d="M786 264H812"/><path d="M812 264l-9 -6v12z" fill="#334155"/><path class="flow" d="M976 264H1002"/><path d="M1002 264l-9 -6v12z" fill="#334155"/>
  <path class="busline" d="M132 314V390H974"/><path class="exception" d="M322 314V390"/><path class="exception" d="M507 314V390"/><path class="exception" d="M702 314V390"/><path class="exception" d="M897 314V390"/><rect class="bus" x="368" y="366" width="344" height="40" rx="20"/><text class="bt" x="540" y="391" text-anchor="middle">任一非终态：cancel 或 error</text>
  <g transform="translate(342 442)"><rect class="terminal" width="250" height="110" rx="18"/><text class="hl" x="125" y="48" text-anchor="middle" fill="#FFFFFF">cancelled</text><text class="sl" x="125" y="78" text-anchor="middle" fill="#CBD5E1">取消终态 · 记录来源</text></g><g transform="translate(688 442)"><rect class="terminal" width="250" height="110" rx="18"/><text class="hl" x="125" y="48" text-anchor="middle" fill="#FFFFFF">failed</text><text class="sl" x="125" y="78" text-anchor="middle" fill="#CBD5E1">失败终态 · 记录原因</text></g><path class="exception" d="M540 406V436H467"/><path d="M467 436l-7 -12h14z" fill="#64748B"/><path class="exception" d="M740 390V436H813"/><path d="M813 436l-7 -12h14z" fill="#64748B"/>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">正常、取消和失败都必须进入明确终态。</text>
</svg>
