<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A">
  <title id="fig-title">图 2-4 Queue 与首次调度的边界</title><desc id="fig-desc">以 queued 事件 t1 和首次 scheduled 事件 t2 闭合 Queue 区间，中间展示请求在 Waiting Queue 中等待。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.event{fill:#0F172A}.eh{font-size:20px;font-weight:750;fill:#FFFFFF}.es{font-size:14px;fill:#CBD5E1}.queue{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.h{font-size:20px;font-weight:750}.s{font-size:14px;fill:#64748B}.req{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.3}.rt{font-size:15px;font-weight:700}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.bracket{fill:none;stroke:#64748B;stroke-width:2}.formula{font-size:19px;font-weight:750}.note{fill:#E2E8F0}.nt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">CLOSED INTERVAL · 04</text><text class="t" x="56" y="84">Queue 时间由两个事件闭合</text><text class="sub" x="56" y="114">第一次进入队列是起点，第一次获得调度是终点；其余客户端等待不能直接算进 Queue</text>
  <g transform="translate(56 270)"><rect class="event" width="212" height="150" rx="20"/><text class="eh" x="106" y="54" text-anchor="middle" fill="#FFFFFF">queued</text><text class="es" x="106" y="86" text-anchor="middle" fill="#CBD5E1">t1</text><text class="es" x="106" y="116" text-anchor="middle" fill="#CBD5E1">请求进入等待集合</text></g>
  <path class="flow" d="M268 345H346"/><path d="M346 345l-11 -7v14z" fill="#334155"/>
  <g transform="translate(352 194)"><rect class="queue" width="532" height="302" rx="22"/><text class="h" x="28" y="48">Waiting Queue</text><text class="s" x="28" y="76">请求已被服务接收，但尚未首次执行</text><g transform="translate(28 116)"><rect class="req" width="144" height="84" rx="14"/><text class="rt" x="72" y="38" text-anchor="middle">Request A</text><text class="s" x="72" y="64" text-anchor="middle">等待</text><rect class="req" x="166" width="144" height="84" rx="14"/><text class="rt" x="238" y="38" text-anchor="middle">Request B</text><text class="s" x="238" y="64" text-anchor="middle">等待</text><rect class="req" x="332" width="144" height="84" rx="14"/><text class="rt" x="404" y="38" text-anchor="middle">Request C</text><text class="s" x="404" y="64" text-anchor="middle">等待</text></g><rect class="note" x="28" y="230" width="476" height="44" rx="12"/><text class="nt" x="266" y="258" text-anchor="middle">调度前：不属于模型 forward 时间</text></g>
  <path class="flow" d="M884 345H962"/><path d="M962 345l-11 -7v14z" fill="#334155"/>
  <g transform="translate(968 270)"><rect class="event" width="256" height="150" rx="20"/><text class="eh" x="128" y="52" text-anchor="middle" fill="#FFFFFF">scheduled</text><text class="es" x="128" y="84" text-anchor="middle" fill="#CBD5E1">first time · t2</text><text class="es" x="128" y="116" text-anchor="middle" fill="#CBD5E1">请求首次进入执行计划</text></g>
  <path class="bracket" d="M162 462V510H1096V462"/><text class="formula" x="629" y="546" text-anchor="middle">Queue = t2 − t1</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">Queue 由 queued 与首次 scheduled 两个事件闭合。</text>
</svg>
