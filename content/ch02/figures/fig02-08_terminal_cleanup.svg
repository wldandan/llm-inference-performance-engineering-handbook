<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter02-v2" fill="#0F172A">
  <title id="fig-title">图 2-8 三类终态与资源清理</title><desc id="fig-desc">finished、cancelled 和 failed 三类终态都汇入停止计算、记录原因、清理状态与释放或复用资源的统一收口流程。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.terminal{fill:#0F172A}.th{font-size:18px;font-weight:750;fill:#FFFFFF}.ts{font-size:14px;fill:#CBD5E1}.node{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.8}.h{font-size:18px;font-weight:750}.s{font-size:14px;fill:#64748B}.flow{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.note{fill:#E2E8F0}.nt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">TERMINAL CONTRACT · 08</text><text class="t" x="56" y="84">三类终态不同，资源收口责任相同</text><text class="sub" x="56" y="114">返回状态码只是结果之一；计算、状态、日志和资源必须共同结束</text>
  <g transform="translate(56 170)"><rect class="terminal" width="216" height="108" rx="18"/><text class="th" x="108" y="44" text-anchor="middle" fill="#FFFFFF">finished</text><text class="ts" x="108" y="74" text-anchor="middle" fill="#CBD5E1">正常完成 · log reason</text></g><g transform="translate(56 306)"><rect class="terminal" width="216" height="108" rx="18"/><text class="th" x="108" y="44" text-anchor="middle" fill="#FFFFFF">cancelled</text><text class="ts" x="108" y="74" text-anchor="middle" fill="#CBD5E1">主动取消 · log reason</text></g><g transform="translate(56 442)"><rect class="terminal" width="216" height="108" rx="18"/><text class="th" x="108" y="44" text-anchor="middle" fill="#FFFFFF">failed</text><text class="ts" x="108" y="74" text-anchor="middle" fill="#CBD5E1">异常失败 · log reason</text></g>
  <path class="flow" d="M272 224H334V342H390"/><path d="M390 342l-11 -7v14z" fill="#334155"/><path class="flow" d="M272 360H390"/><path d="M390 360l-11 -7v14z" fill="#334155"/><path class="flow" d="M272 496H334V378H390"/><path d="M390 378l-11 -7v14z" fill="#334155"/>
  <g transform="translate(396 294)"><rect class="node" width="220" height="132" rx="18"/><text class="h" x="110" y="48" text-anchor="middle">Stop Compute</text><text class="s" x="110" y="78" text-anchor="middle">停止进入后续 iteration</text><text class="s" x="110" y="104" text-anchor="middle">关闭请求执行状态</text></g><path class="flow" d="M616 360H672"/><path d="M672 360l-11 -7v14z" fill="#334155"/>
  <g transform="translate(678 294)"><rect class="node" width="220" height="132" rx="18"/><text class="h" x="110" y="48" text-anchor="middle">State Cleanup</text><text class="s" x="110" y="78" text-anchor="middle">保存 usage 与终态</text><text class="s" x="110" y="104" text-anchor="middle">清理临时请求状态</text></g><path class="flow" d="M898 360H954"/><path d="M954 360l-11 -7v14z" fill="#334155"/>
  <g transform="translate(960 294)"><rect class="node" width="264" height="132" rx="18"/><text class="h" x="132" y="48" text-anchor="middle">Resource Handoff</text><text class="s" x="132" y="78" text-anchor="middle">释放或按显式策略复用</text><text class="s" x="132" y="104" text-anchor="middle">KV block · slot · buffer</text></g>
  <rect class="note" x="396" y="470" width="828" height="62" rx="14"/><text class="nt" x="810" y="496" text-anchor="middle">Prefix / Session Cache 可以保留，但必须有明确 owner 和 policy</text><text class="s" x="810" y="518" text-anchor="middle">“请求结束”不等于所有缓存都立即删除，也不允许资源无主残留</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">请求终止后，计算、状态和资源都必须完成收口。</text>
</svg>
