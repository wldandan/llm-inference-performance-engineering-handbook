<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A">
  <title id="fig-title">图 3-4 MHA 与 GQA</title><desc id="fig-desc">对比标准 Multi-Head Attention 的 Q/K/V 头一一对应，与 GQA 中多组 Query Heads 共享少量 K/V Heads 的结构。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:18px;font-weight:750}.hd{font-size:18px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.head{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.3}.q{fill:#FFFFFF;stroke:#0F172A;stroke-width:1.6}.kv{fill:#0F172A}.ht{font-size:14px;font-weight:750}.kvt{font-size:14px;font-weight:750;fill:#FFFFFF}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">HEAD SHARING · 04</text><text class="t" x="56" y="84">MHA 与 GQA：减少的是 K/V Heads</text><text class="sub" x="56" y="114">示例配置：14 个 Query Heads，2 个 KV Heads，每 7 个 Query Heads 共享一组 K/V</text>
  <g transform="translate(56 166)"><rect class="panel" width="1168" height="166" rx="20"/><rect class="dark" width="190" height="166" rx="20"/><path d="M170 0H190V166H170Z" fill="#0F172A"/><text class="hd" x="24" y="60" fill="#FFFFFF">MHA</text><text class="s" x="24" y="92" fill="#CBD5E1">Q / K / V</text><text class="s" x="24" y="120" fill="#CBD5E1">Head 数相同</text>
    <g transform="translate(240 34)"><rect class="q" width="82" height="44" rx="12"/><text class="ht" x="41" y="28" text-anchor="middle">Q1</text><rect class="kv" y="56" width="82" height="44" rx="12"/><text class="kvt" x="41" y="84" text-anchor="middle" fill="#FFFFFF">K1 / V1</text></g>
    <g transform="translate(370 34)"><rect class="q" width="82" height="44" rx="12"/><text class="ht" x="41" y="28" text-anchor="middle">Q2</text><rect class="kv" y="56" width="82" height="44" rx="12"/><text class="kvt" x="41" y="84" text-anchor="middle" fill="#FFFFFF">K2 / V2</text></g>
    <g transform="translate(500 34)"><rect class="q" width="82" height="44" rx="12"/><text class="ht" x="41" y="28" text-anchor="middle">Q3</text><rect class="kv" y="56" width="82" height="44" rx="12"/><text class="kvt" x="41" y="84" text-anchor="middle" fill="#FFFFFF">K3 / V3</text></g>
    <text class="h" x="664" y="86">···</text><g transform="translate(760 34)"><rect class="q" width="120" height="44" rx="12"/><text class="ht" x="60" y="28" text-anchor="middle">Q14</text><rect class="kv" y="56" width="120" height="44" rx="12"/><text class="kvt" x="60" y="84" text-anchor="middle" fill="#FFFFFF">K14 / V14</text></g>
  </g>
  <g transform="translate(56 364)"><rect class="panel" width="1168" height="214" rx="20"/><rect class="dark" width="190" height="214" rx="20"/><path d="M170 0H190V214H170Z" fill="#0F172A"/><text class="hd" x="24" y="72" fill="#FFFFFF">GQA</text><text class="s" x="24" y="104" fill="#CBD5E1">14 Q Heads</text><text class="s" x="24" y="132" fill="#CBD5E1">2 KV Heads</text>
    <text class="s" x="240" y="42">GROUP 1 · Q1–Q7</text><g transform="translate(240 60)"><rect class="q" width="360" height="54" rx="14"/><text class="ht" x="180" y="34" text-anchor="middle">Q1 · Q2 · Q3 · Q4 · Q5 · Q6 · Q7</text><rect class="kv" x="390" width="170" height="54" rx="14"/><text class="kvt" x="475" y="34" text-anchor="middle" fill="#FFFFFF">K1 / V1</text><path class="flow" d="M360 27H384"/></g>
    <text class="s" x="240" y="150">GROUP 2 · Q8–Q14</text><g transform="translate(240 160)"><rect class="q" width="360" height="40" rx="12"/><text class="ht" x="180" y="26" text-anchor="middle">Q8 · Q9 · Q10 · Q11 · Q12 · Q13 · Q14</text><rect class="kv" x="390" width="170" height="40" rx="12"/><text class="kvt" x="475" y="26" text-anchor="middle" fill="#FFFFFF">K2 / V2</text><path class="flow" d="M360 20H384"/></g>
    <text class="h" x="888" y="102">7 Q</text><text class="s" x="888" y="132">share 1 KV</text>
  </g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">GQA 减少的是 K/V Heads，不是 Query Heads。</text>
</svg>
