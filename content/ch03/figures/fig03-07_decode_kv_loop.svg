<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter03-v2" fill="#0F172A">
  <title id="fig-title">图 3-7 Decode 与 KV Cache 循环</title><desc id="fig-desc">展示 Prefill 完成后，普通 Decode 每步输入一个新 token，复用 Past K/V，执行单 token 前向计算并追加当前 K/V，再采样下一 token 的循环。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:17px;font-weight:750}.hd{font-size:17px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.sd{font-size:14px;fill:#CBD5E1}.flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow)}.loop{fill:none;stroke:#64748B;stroke-width:2.2;stroke-dasharray:8 6;marker-end:url(#arrow)}.tag{fill:#E2E8F0}.tagt{font-size:14px;font-weight:700;fill:#475569}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}
  </style></defs><rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">AUTOREGRESSIVE LOOP · 07</text><text class="t" x="56" y="84">Decode 与 KV Cache：一次推进一个 token</text><text class="sub" x="56" y="114">每一步都读取历史 Cache，只计算当前输入 token 对应的新状态</text>
  <g transform="translate(56 222)"><rect class="card" width="164" height="200" rx="18"/><text class="h" x="82" y="52" text-anchor="middle">Prefill Complete</text><text class="s" x="82" y="90" text-anchor="middle">Prompt K/V 已写入</text><rect class="tag" x="20" y="122" width="124" height="40" rx="20"/><text class="tagt" x="82" y="148" text-anchor="middle">Cache Length S</text></g>
  <g transform="translate(276 222)"><rect class="card" width="176" height="200" rx="18"/><text class="h" x="88" y="50" text-anchor="middle">New Token</text><text class="s" x="88" y="84" text-anchor="middle">+</text><text class="h" x="88" y="118" text-anchor="middle">Past K/V</text><text class="s" x="88" y="158" text-anchor="middle">本步输入</text></g>
  <g transform="translate(508 222)"><rect class="dark" width="176" height="200" rx="18"/><text class="hd" x="88" y="72" text-anchor="middle" fill="#FFFFFF">One-token</text><text class="hd" x="88" y="102" text-anchor="middle" fill="#FFFFFF">Forward</text><text class="sd" x="88" y="144" text-anchor="middle" fill="#CBD5E1">All Layers</text></g>
  <g transform="translate(740 222)"><rect class="card" width="176" height="200" rx="18"/><text class="h" x="88" y="50" text-anchor="middle">Append Current K/V</text><text class="s" x="88" y="88" text-anchor="middle">每层追加一份</text><rect class="tag" x="22" y="120" width="132" height="40" rx="20"/><text class="tagt" x="88" y="146" text-anchor="middle">Cache Length +1</text></g>
  <g transform="translate(972 222)"><rect class="card" width="124" height="200" rx="18"/><text class="h" x="62" y="62" text-anchor="middle">Next-token</text><text class="h" x="62" y="90" text-anchor="middle">Logits</text><text class="s" x="62" y="138" text-anchor="middle">LM Head</text></g>
  <g transform="translate(1152 222)"><rect class="dark" width="72" height="200" rx="18"/><text class="hd" x="36" y="74" text-anchor="middle" fill="#FFFFFF">Sample</text><text class="sd" x="36" y="112" text-anchor="middle" fill="#CBD5E1">next</text><text class="sd" x="36" y="138" text-anchor="middle" fill="#CBD5E1">token</text></g>
  <path class="flow" d="M220 322H270"/><path d="M270 322l-9 -6v12z" fill="#334155"/><path class="flow" d="M452 322H502"/><path d="M502 322l-9 -6v12z" fill="#334155"/><path class="flow" d="M684 322H734"/><path d="M734 322l-9 -6v12z" fill="#334155"/><path class="flow" d="M916 322H966"/><path d="M966 322l-9 -6v12z" fill="#334155"/><path class="flow" d="M1096 322H1146"/><path d="M1146 322l-9 -6v12z" fill="#334155"/>
  <path class="loop" d="M1188 422V510Q1188 536 1162 536H390Q364 536 364 510V430"/><path d="M364 430l-6 9h12z" fill="#334155"/><rect class="tag" x="588" y="514" width="376" height="44" rx="22"/><text class="tagt" x="776" y="542" text-anchor="middle">Repeat Until EOS / Stop Condition</text>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">普通 Decode 每步复用历史 K/V，只为当前 token 追加一份新状态。</text>
</svg>
