<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fig-title fig-desc" data-figure-system="chapter05-v2" fill="#0F172A">
  <title id="fig-title">图 5-8 可比较的指标合同</title><desc id="fig-desc">将 Question、Workload、Boundary、Clock、Window、Unit、Aggregation、Denominator、Failures 与 Sample 十项合同汇总到 Comparable Metric。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#64748B}.t{font-size:32px;font-weight:750}.sub{font-size:16px;fill:#64748B}.card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.7}.dark{fill:#0F172A}.h{font-size:16px;font-weight:750}.hd{font-size:20px;font-weight:750;fill:#FFFFFF}.s{font-size:14px;fill:#64748B}.flow{fill:none;stroke:#334155;stroke-width:2.3;marker-end:url(#arrow)}.take{fill:#0F172A}.tl{font-size:14px;font-weight:700;letter-spacing:1px;fill:#CBD5E1}.tv{font-size:19px;font-weight:650;fill:#FFFFFF}</style></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text class="k" x="56" y="46">MEASUREMENT CONTRACT · 08</text><text class="t" x="56" y="84">可比较的指标合同</text><text class="sub" x="56" y="114">指标名只是标签；下面十项共同决定数字含义</text>
  <g transform="translate(56 172)"><rect class="card" width="184" height="88" rx="16"/><text class="h" x="92" y="36" text-anchor="middle">Question</text><text class="s" x="92" y="64" text-anchor="middle">回答什么？</text></g><g transform="translate(260 172)"><rect class="card" width="184" height="88" rx="16"/><text class="h" x="92" y="36" text-anchor="middle">Workload</text><text class="s" x="92" y="64" text-anchor="middle">模型与请求分布</text></g><g transform="translate(464 172)"><rect class="card" width="184" height="88" rx="16"/><text class="h" x="92" y="36" text-anchor="middle">Boundary</text><text class="s" x="92" y="64" text-anchor="middle">Client / Server / GPU</text></g><g transform="translate(668 172)"><rect class="card" width="184" height="88" rx="16"/><text class="h" x="92" y="36" text-anchor="middle">Clock</text><text class="s" x="92" y="64" text-anchor="middle">时钟与同步</text></g><g transform="translate(872 172)"><rect class="card" width="184" height="88" rx="16"/><text class="h" x="92" y="36" text-anchor="middle">Window</text><text class="s" x="92" y="64" text-anchor="middle">起止事件</text></g><g transform="translate(1076 172)"><rect class="card" width="148" height="88" rx="16"/><text class="h" x="74" y="36" text-anchor="middle">Unit</text><text class="s" x="74" y="64" text-anchor="middle">ms / s / USD</text></g>
  <g transform="translate(122 296)"><rect class="card" width="224" height="88" rx="16"/><text class="h" x="112" y="36" text-anchor="middle">Aggregation</text><text class="s" x="112" y="64" text-anchor="middle">mean / percentile / window</text></g><g transform="translate(392 296)"><rect class="card" width="224" height="88" rx="16"/><text class="h" x="112" y="36" text-anchor="middle">Denominator</text><text class="s" x="112" y="64" text-anchor="middle">token / request / good</text></g><g transform="translate(662 296)"><rect class="card" width="224" height="88" rx="16"/><text class="h" x="112" y="36" text-anchor="middle">Failures</text><text class="s" x="112" y="64" text-anchor="middle">失败、取消与重试</text></g><g transform="translate(932 296)"><rect class="card" width="224" height="88" rx="16"/><text class="h" x="112" y="36" text-anchor="middle">Sample</text><text class="s" x="112" y="64" text-anchor="middle">数量、重复与分桶</text></g>
  <path class="flow" d="M640 396V458"/><path d="M640 458l-6 -9h12z" fill="#334155"/><g transform="translate(346 464)"><rect class="dark" width="588" height="112" rx="24"/><text class="hd" x="294" y="48" text-anchor="middle" fill="#FFFFFF">Comparable Metric</text><text x="294" y="80" text-anchor="middle" font-size="14" fill="#CBD5E1">Same definition · Same workload · Same evidence boundary</text></g>
  <rect class="take" x="56" y="642" width="1168" height="54" rx="14"/><text class="tl" x="80" y="675" fill="#CBD5E1">关键结论</text><text class="tv" x="184" y="676" fill="#FFFFFF">指标名称相同，不代表测量合同相同。</text>
</svg>
