<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">RAG 端到端性能路径</title>
  <desc id="desc">混合 RAG 从并行检索、合并、重排和上下文构造进入 LLM Prefill 与 Decode，并保留质量护栏。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:16px;font-weight:700}.body{font-size:14px;fill:#475569}.lane{font-size:15px;font-weight:700;fill:#FFFFFF}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0F766E"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text x="70" y="72" class="title">RAG 端到端性能路径</text><text x="70" y="104" class="sub">检索本身进入关键路径；检索结果还会通过上下文长度影响 LLM</text>
  <rect x="70" y="150" width="145" height="330" rx="18" fill="#0F172A"/><text x="142" y="198" class="lane" text-anchor="middle">Request</text><rect x="95" y="245" width="95" height="70" rx="13" fill="#DBEAFE"/><text x="142" y="274" class="label" text-anchor="middle">Ingress</text><text x="142" y="299" class="body" text-anchor="middle">15 ms</text>
  <rect x="250" y="150" width="370" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="275" y="190" class="label">Retrieval Plane</text><rect x="280" y="225" width="145" height="75" rx="13" fill="#ECFEFF" stroke="#67E8F9"/><text x="352" y="255" class="label" text-anchor="middle">Dense</text><text x="352" y="280" class="body" text-anchor="middle">120 ms</text><rect x="280" y="340" width="145" height="75" rx="13" fill="#FEF3C7" stroke="#FCD34D"/><text x="352" y="370" class="label" text-anchor="middle">Keyword</text><text x="352" y="395" class="body" text-anchor="middle">190 ms</text><rect x="470" y="282" width="120" height="75" rx="13" fill="#F1F5F9" stroke="#CBD5E1"/><text x="530" y="312" class="label" text-anchor="middle">Merge</text><text x="530" y="337" class="body" text-anchor="middle">20 ms</text>
  <rect x="655" y="150" width="245" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="680" y="190" class="label">Context Plane</text><rect x="685" y="225" width="185" height="75" rx="13" fill="#FCE7F3" stroke="#F9A8D4"/><text x="777" y="255" class="label" text-anchor="middle">Rerank</text><text x="777" y="280" class="body" text-anchor="middle">Top-K / Quality</text><rect x="685" y="340" width="185" height="75" rx="13" fill="#F1F5F9" stroke="#CBD5E1"/><text x="777" y="370" class="label" text-anchor="middle">Context Build</text><text x="777" y="395" class="body" text-anchor="middle">prompt tokens</text>
  <rect x="935" y="150" width="275" height="330" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/><text x="960" y="190" class="label">LLM Plane</text><rect x="965" y="225" width="215" height="75" rx="13" fill="#CCFBF1" stroke="#5EEAD4"/><text x="1072" y="255" class="label" text-anchor="middle">Prefill</text><text x="1072" y="280" class="body" text-anchor="middle">输入决定工作量</text><rect x="965" y="340" width="215" height="75" rx="13" fill="#EDE9FE" stroke="#C4B5FD"/><text x="1072" y="370" class="label" text-anchor="middle">Decode</text><text x="1072" y="395" class="body" text-anchor="middle">生成输出</text>
  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"><path d="M190 280 C225 280 235 262 275 262"/><path d="M190 280 C225 280 235 377 275 377"/><path d="M425 262 C450 262 445 305 465 312"/><path d="M425 377 C450 377 445 335 465 327"/><path d="M590 320 C635 320 640 262 680 262"/><path d="M777 300 V335"/><path d="M870 377 C920 377 915 262 960 262"/><path d="M1072 300 V335"/></g>
  <g fill="#64748B"><path d="M275 262l-9-6v12z"/><path d="M275 377l-9-6v12z"/><path d="M465 312l-10-4 6-8z"/><path d="M465 327l-10 4 6 8z"/><path d="M680 262l-9-6v12z"/><path d="M777 335l-6-10h12z"/><path d="M960 262l-9-6v12z"/><path d="M1072 335l-6-10h12z"/></g>
  <path d="M777 420 C800 520 1040 530 1072 420" fill="none" stroke="#0F766E" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#tealArrow)"/><text x="915" y="536" class="body" text-anchor="middle">更多文档 / 更长片段 → prompt tokens ↑</text>
  <path d="M1072 420l-1 11-10-5z" fill="#0F766E"/>
  <rect x="70" y="570" width="1140" height="86" rx="18" fill="#0F172A"/><text x="100" y="606" class="conclusion">关键结论</text><text x="100" y="636" class="conclusion">RAG 要同时衡量检索路径、上下文工作量和答案质量；只看 LLM 指标会丢失前半条链。</text>
</svg>
