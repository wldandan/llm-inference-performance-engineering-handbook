<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-figure-system="chapter07-v2" role="img" aria-labelledby="title desc">
  <title id="title">Agent 端到端性能路径</title>
  <desc id="desc">Agent 任务由 LLM 规划、并行工具、汇合与 LLM 回答构成，并可能出现重试和上下文持续增长。</desc>
  <defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#475569}.label{font-size:17px;font-weight:700}.body{font-size:15px;fill:#475569}.tag{font-size:14px;font-weight:600}.conclusion{font-size:18px;font-weight:600;fill:#FFFFFF}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#EF4444"/></marker></defs>
  <rect width="1280" height="720" fill="#F8FAFC"/><text x="70" y="72" class="title">Agent 端到端性能路径</text><text x="70" y="104" class="sub">优化对象从单次 LLM 请求，上升为包含工具、分支与重试的完整任务</text>
  <rect x="70" y="285" width="170" height="96" rx="17" fill="#DBEAFE" stroke="#93C5FD"/><text x="155" y="323" class="label" text-anchor="middle">LLM · Plan</text><text x="155" y="351" class="body" text-anchor="middle">prompt 1 · 220 ms</text>
  <rect x="330" y="175" width="210" height="96" rx="17" fill="#FEF3C7" stroke="#FCD34D"/><text x="435" y="213" class="label" text-anchor="middle">Tool · CRM</text><text x="435" y="241" class="body" text-anchor="middle">500 ms · Critical</text>
  <rect x="330" y="395" width="210" height="96" rx="17" fill="#ECFEFF" stroke="#67E8F9"/><text x="435" y="433" class="label" text-anchor="middle">Tool · Search</text><text x="435" y="461" class="body" text-anchor="middle">300 ms · Parallel</text>
  <rect x="650" y="285" width="160" height="96" rx="17" fill="#F1F5F9" stroke="#CBD5E1"/><text x="730" y="323" class="label" text-anchor="middle">Merge</text><text x="730" y="351" class="body" text-anchor="middle">tool results</text>
  <rect x="915" y="285" width="220" height="96" rx="17" fill="#EDE9FE" stroke="#C4B5FD"/><text x="1025" y="323" class="label" text-anchor="middle">LLM · Answer</text><text x="1025" y="351" class="body" text-anchor="middle">prompt 2 ↑ · 420 ms</text>
  <g fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"><path d="M240 333 C280 333 280 223 325 223"/><path d="M240 333 C280 333 280 443 325 443"/><path d="M540 223 C600 223 600 313 645 313"/><path d="M540 443 C600 443 600 353 645 353"/><path d="M810 333 H910"/></g>
  <g fill="#64748B"><path d="M325 223l-10-6v12z"/><path d="M325 443l-10-6v12z"/><path d="M645 313l-10-6v12z"/><path d="M645 353l-10-6v12z"/><path d="M910 333l-10-6v12z"/></g>
  <path d="M435 175 C435 125 555 125 555 223 C555 258 545 270 520 279" fill="none" stroke="#EF4444" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#redArrow)"/><text x="515" y="145" class="tag" fill="#DC2626">timeout → retry</text>
  <path d="M520 279l5-11 8 7z" fill="#EF4444"/>
  <rect x="70" y="520" width="340" height="45" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="240" y="549" class="tag" text-anchor="middle">单次 LLM：TTFT / TPOT / tokens</text><rect x="470" y="520" width="340" height="45" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="640" y="549" class="tag" text-anchor="middle">单个工具：latency / timeout / retry</text><rect x="870" y="520" width="340" height="45" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1040" y="549" class="tag" text-anchor="middle">完整任务：E2E / success / cost</text>
  <rect x="70" y="590" width="1140" height="66" rx="18" fill="#0F172A"/><text x="100" y="630" class="conclusion">关键结论　Agent 要按任务计算 Critical Path，并保留每轮 LLM、并行工具、超时重试和上下文增长。</text>
</svg>
