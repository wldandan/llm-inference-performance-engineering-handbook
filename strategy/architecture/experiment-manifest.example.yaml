schema_version: "1.0"
experiment:
  id: prefix-cache-reuse-matrix
  chapter_ids: ["ch18", "ch23"]
  level: L2
  question: "Prefix reuse rate 如何影响 TTFT 与 Prefill 工作量？"
  primary_factor: prefix_cache
  expected_effect:
    metric: latency.ttft_ms.p95
    direction: decrease
  allowed_differences:
    - engine.prefix_caching

source:
  git_commit: "REPLACE_WITH_COMMIT"
  workload_sha256: "REPLACE_WITH_SHA256"

model:
  id: "Qwen/Qwen2.5-7B-Instruct"
  revision: "REPLACE_WITH_REVISION"
  tokenizer_revision: "REPLACE_WITH_REVISION"
  dtype: bfloat16
  quantization: null
  max_model_len: 8192

engine:
  name: vllm
  version: "REPLACE_WITH_EXACT_VERSION"
  container_digest: "REPLACE_WITH_DIGEST"
  endpoint: /v1/chat/completions
  streaming: true
  prefix_caching: false
  extra_args: []

hardware:
  gpu_model: "REPLACE_WITH_GPU"
  gpu_count: 1
  gpu_memory_gib: null
  topology: single-gpu
  mig: false
  driver_version: "REPLACE_WITH_VERSION"
  cuda_version: "REPLACE_WITH_VERSION"
  power_limit_watts: null

workload:
  dataset: requests.jsonl
  shape: L-S
  prefix_reuse_ratio: 1.0
  input_tokens:
    target_p50: 4096
  output_tokens:
    target_p50: 128
  sampling:
    temperature: 0.0
    seed: 42
  arrival:
    model: closed_loop
    concurrency: 4

procedure:
  readiness_timeout_seconds: 300
  warmup:
    requests: 20
    minimum_seconds: 30
    cache_policy: cold_then_prime
  measurement:
    minimum_requests: 100
    minimum_seconds: 120
  trials: 5
  order: ABBA
  reset_between_trials:
    restart_server: true
    reset_prefix_cache: true

slo:
  # These values are syntax examples only. Define them from the use case before running.
  ttft_ms: null
  tpot_ms: null
  e2e_ms: null
  success_rate: 0.99

metrics:
  primary:
    - latency.ttft_ms.p95
    - throughput.input_tokens_per_second
  guardrails:
    - throughput.output_tokens_per_second
    - reliability.success_rate
    - resource.gpu_memory_peak_mib
  diagnostic:
    - cache.prefix_hit_rate
    - lifecycle.queue_delay_ms.p95

artifacts:
  request_records: request-records.jsonl
  environment: environment.json
  server_args: server-args.json
  gpu_timeseries: gpu-timeseries.csv
  report: report.json
